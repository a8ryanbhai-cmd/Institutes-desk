// reads a chosen image, shrinks large ones, and returns {name,url (data URL for preview),data (base64 for upload)}
function prepImage(f){return new Promise((res,rej)=>{
 if(!f)return rej(Error('Choose an image first'));if(!['image/jpeg','image/png','image/webp'].includes(f.type))return rej(Error('Only JPG, PNG or WebP images are allowed'));if(f.size>15e6)return rej(Error('That image is too large. Choose one under 15 MB'));
 const r=new FileReader();r.onerror=()=>rej(Error('Could not read that image'));
 r.onload=()=>{const src=r.result,im=new Image();im.onerror=()=>rej(Error('That file is not a valid image'));
  im.onload=()=>{let url=src;if(im.naturalWidth>1920||f.size>1.5e6){const w=Math.min(1920,im.naturalWidth),h=Math.round(im.naturalHeight*w/im.naturalWidth),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);url=c.toDataURL('image/jpeg',.86)}
   const data=url.split(',')[1];if(data.length*.75>3.9e6)return rej(Error('That image is still too large. Try a smaller one'));res({name:f.name,url,data})};im.src=src};r.readAsDataURL(f)})}

 else body=`${q&&dn?`<div class="note warn"><i class="dot warn"></i><span>Some of these students share the same name. Check the ${lc}, section, admission number and parent details to pick the right one.</span></div>`:''}<div class="card"><p class="mut small" style="margin:0 0 6px">${q?`${r.total} match${r.total==1?'':'es'}`:`Showing ${from}-${from+rows.length-1} of ${r.total} student${r.total==1?'':'s'}`}. Tap a row to see the full record.</p>
 <table style="min-width:860px"><tr><th>Admission no.</th><th>Student</th><th>${S.L[0]}</th><th>Section</th><th>Roll no.</th><th>Parent / guardian</th><th>Parent contact</th><th></th></tr>${rows.map(s=>`<tr data-id="${s.id}"><td>${esc(s.adm_no)}</td><td><div class="row" style="gap:0;flex-wrap:nowrap">${av(s.name)}<div><b>${esc(s.name)}</b>${s.dup>1?`<div><span class="tag warn">Same name × ${s.dup}</span></div>`:''}</div></div></td><td>${esc(s.cls)}</td><td>${dsh(s.section)}</td><td>${dsh(s.roll)}</td><td>${dsh(s.parent)}${s.relation?`<div class="mut small">${esc(s.relation)}</div>`:''}</td><td>${esc(fPhone(s.phone))}</td><td><button class="btn sm t" data-vw="${s.id}" type="button">View</button></td></tr>`).join('')}</table>

function mgTeachers(){const d=S.mg,v=TV(),T=d.teachers,lc=S.L[0].toLowerCase();
need('#pane').innerHTML=`<div class="card toolbar"><div class="sbox">${ic('search',17)}<input id="tq" type="search" placeholder="Search by name or username" value="${esc(v.tq)}" autocomplete="off"></div><div class="seg" id="tf">${[['all','All'],['on','Active'],['off','Disabled'],['none','No '+lc]].map(([k,t])=>`<button type="button" data-f="${k}" class="${v.tf==k?'on':''}">${t}</button>`).join('')}</div><button class="btn p" id="tnew" type="button">${ic('plus',16)}Add teacher</button></div><p class="mut small" id="tcnt" style="margin:0 2px 12px"></p><div id="tl"></div>`;
const draw=()=>{const q=v.tq.trim().toLowerCase(),rows=T.filter(t=>(v.tf=='all'||(v.tf=='on'&&t.active)||(v.tf=='off'&&!t.active)||(v.tf=='none'&&!t.sec))&&(!q||(tn(t)+' '+t.username).toLowerCase().includes(q)));
 $('#tcnt').textContent=T.length?(rows.length==T.length?`${T.length} class teacher${T.length==1?'':'s'}`:`Showing ${rows.length} of ${T.length}`):'';
 $('#tl').innerHTML=!T.length?`<div class="card">${empty('No class teachers yet','Add a teacher and choose the '+lc+' they will manage.')}</div>`:rows.length?`<div class="plist">${rows.map(t=>`<div class="pcard"><div class="row" style="gap:12px;flex-wrap:nowrap">${av(tn(t))}<div style="flex:1;min-width:0"><b>${esc(tn(t))}</b><div class="mut">@${esc(t.username)}</div><div class="mut small">Last sign-in: ${when(t.last_login)}</div></div><span class="tag ${t.active?'ok':'no'}">${t.active?'Active':'Disabled'}</span></div>
  <div><span class="tag ${t.sec?'':'warn'}">${t.sec?esc(t.sec_label)+' · '+t.students+' student'+(t.students==1?'':'s'):'No '+lc+' assigned'}</span></div>
  <div class="row"><button class="btn sm t" data-a="${t.id}" type="button">${t.sec?'Change '+lc:'Assign '+lc}</button><button class="btn sm" data-e="${t.id}" type="button">Edit login</button><button class="btn sm" data-r="${t.id}" type="button">Reset password</button><button class="btn sm" data-t="${t.id}" type="button">${t.active?'Disable':'Enable'}</button><button class="btn sm d" data-d="${t.id}" type="button">Delete</button></div></div>`).join('')}</div>`:`<div class="card">${empty('No teachers match','Try a different search or filter.')}</div>`;
 const by=a=>T.find(t=>t.id==a);for(const [k,f] of [['a',mgAssignTeacher],['r',mgReset],['t',mgToggle],['d',mgDelete]])document.querySelectorAll(`#tl [data-${k}]`).forEach(b=>b.onclick=()=>run(()=>f(by(b.dataset[k]))));document.querySelectorAll('#tl [data-e]').forEach(b=>b.onclick=()=>mgEdit(by(b.dataset.e)))};
$('#tq').oninput=e=>{v.tq=e.target.value;draw()};document.querySelectorAll('#tf [data-f]').forEach(b=>b.onclick=()=>{v.tf=b.dataset.f;document.querySelectorAll('#tf [data-f]').forEach(x=>x.classList.toggle('on',x==b));draw()});$('#tnew').onclick=()=>mgCreate();draw()}

function colsModal(){const v=document.createElement('div');v.className='veil';document.body.append(v);
const draw=()=>{v.innerHTML=`<div class="card" style="max-height:90vh;overflow:auto"><h2>Columns</h2><p class="mut">Name, Parent number and Roll no. are always there. Add your own, like address or date of birth.</p>${S.cols.map(c=>`<div class="row" style="margin:8px 0"><b style="flex:1">${esc(c.name)} <span class="tag">${c.type}</span></b><button class="btn sm" data-rn="${c.id}">Edit</button>${isAdm()?`<button class="btn sm d" data-rm="${c.id}">Delete</button>`:''}</div>`).join('')||'<p class="mut">No extra columns yet.</p>'}
<h2 style="margin-top:14px;font-size:17px">Add a column</h2><label>Column name</label><input id="cn" style="width:100%"><label>Type</label><select id="ct"><option value="text">Text</option><option value="date">Date</option><option value="number">Number</option><option value="dropdown">Dropdown</option></select><div id="co2" style="display:none"><label>Options (one per line)</label><textarea id="cop" style="min-height:80px"></textarea></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="cc">Close</button><button class="btn p" id="ca">Add column</button></div></div>`;
$('#ct').onchange=e=>{$('#co2').style.display=e.target.value=='dropdown'?'block':'none'};$('#cc').onclick=()=>{v.remove();V.stu()};
$('#ca').onclick=()=>run(async()=>{const b={inst:S.inst,name:$('#cn').value,type:$('#ct').value,opts:$('#cop').value};if(await ask(`<p>Add column "${esc(b.name)}"?</p>`)){await api('cols','POST',b);S.cols=await api('cols?inst='+S.inst);draw();toast('Column added')}});
v.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>run(async()=>{const c=S.cols.find(x=>x.id==b.dataset.rn);const r=await ask(`<h2>Edit column</h2><label>Name</label><input id="rn" style="width:100%" value="${esc(c.name)}">${c.type=='dropdown'?`<label>Options (one per line)</label><textarea id="ro" style="min-height:80px">${esc(c.opts.join('\n'))}</textarea>`:''}`,()=>({name:$('#rn').value,opts:c.type=='dropdown'?$('#ro').value:''}));if(r){await api('cols/'+c.id,'PUT',r);S.cols=await api('cols?inst='+S.inst);draw()}}));
v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>run(async()=>{if(await ask('<h2>Delete this column?</h2><p>The values typed in it will no longer be shown.</p>')){await api('cols/'+b.dataset.rm,'DELETE');S.cols=await api('cols?inst='+S.inst);draw()}}))};draw()}
function actHtml(list,showInst){return `<div class="card"><h2>Activity</h2><p class="mut">Latest 200 actions.</p><table><tr><th>Time</th><th>User</th>${showInst?'<th>Institute</th>':''}<th>Action</th><th>Details</th></tr>${list.map(a=>`<tr><td class="mut">${when(a.ts)}</td><td>${esc(a.uname)}<br><span class="mut">${esc(a.role)}</span></td>${showInst?`<td>${esc(a.inst_name||'-')}</td>`:''}<td>${esc(a.action)}</td><td class="mut">${esc(a.detail)}</td></tr>`).join('')}</table></div>`}
let last=Date.now();['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{last=Date.now()},{passive:true}));
setInterval(()=>{if(T&&Date.now()-last>30*60e3)out('You were signed out after 30 minutes of inactivity.')},30000);
addEventListener('keydown',e=>{if(e.key=='Escape')document.body.classList.remove('nav-open')});
T?boot().catch(()=>login()):login();
</script></body></html>
