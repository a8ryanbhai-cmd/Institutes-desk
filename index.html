/* ===== Student management (Phase 3) ===== */
const SV=()=>S.sv||(S.sv={tab:'list',view:'all',q:'',cls:'',sec:'',page:1});
const GEN=['Male','Female','Other'],REL=['Father','Mother','Guardian','Other'];
const dsh=v=>v?esc(v):'<span class="mut">-</span>';
const fPhone=p=>{p=String(p||'');return p.length==12&&p.startsWith('91')?'+91 '+p.slice(2,7)+' '+p.slice(7):p?'+'+p:''};
const lPhone=p=>{p=String(p||'');return p.length==12&&p.startsWith('91')?p.slice(2):p};
const fDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const modal=(html,w)=>{const m=document.createElement('div');m.className='veil';m.innerHTML=`<div class="card sform" style="max-width:${w||700}px">${html}</div>`;document.body.append(m);return m};
const mySecs=()=>S.secs.filter(s=>!s.locked);

function stuClasses(){const lc=S.L[0].toLowerCase(),secs=S.secs,tot=secs.reduce((a,s)=>a+s.n,0);
need('#pane').innerHTML=`<div class="card"><h2>Add a ${lc}</h2><p class="mut">The ${lc} name is required. The section is optional, for example A or B. To create several sections of one ${lc} together, separate them with commas (A, B, C).</p>
<div class="grid"><div><label>${S.L[0]} name *</label><input id="cn" maxlength="60" placeholder="${S.L[0]=='Class'?'e.g. Class 5':'e.g. NEET 2027'}" autocomplete="off"></div><div><label>Section (optional)</label><input id="cs" maxlength="80" placeholder="e.g. A" autocomplete="off"></div></div>
<div style="margin-top:14px"><button class="btn p" id="ca" type="button">${ic('plus',16)}Add ${lc}</button></div></div>
<div class="card"><div class="row"><h2 class="sp">${S.L[1]} and sections</h2><span class="tag">${secs.length} · ${tot} student${tot==1?'':'s'}</span></div>
${secs.length?`<table><tr><th>${S.L[0]}</th><th>Section</th><th>Students</th><th>Teacher</th><th></th></tr>${secs.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.section?esc(s.section):'<span class="mut">None</span>'}</td><td>${s.n}</td><td>${esc(s.teacher||'-')}</td><td><div class="row"><button class="btn sm" data-e="${s.id}" type="button">Edit</button><button class="btn sm d" data-x="${s.id}" type="button">Delete</button></div></td></tr>`).join('')}</table>`:empty('No '+S.L[1].toLowerCase()+' yet','Add the first one above.')}</div>`;
$('#ca').onclick=()=>run(async()=>{const name=$('#cn').value.trim(),sections=$('#cs').value.split(',').map(x=>x.trim()).filter(Boolean);if(!name){$('#cn').focus();throw Error(S.L[0]+' name is required')}
const r=await api('sec','POST',{inst:S.inst,name,sections});toast(r.ids.length>1?r.ids.length+' sections added':S.L[0]+' added');V.stu()});
$('#cn').onkeydown=$('#cs').onkeydown=e=>{if(e.key=='Enter')$('#ca').click()};
document.querySelectorAll('#pane [data-e]').forEach(b=>b.onclick=()=>run(async()=>{const s=S.secs.find(x=>x.id==b.dataset.e);
const r=await ask(`<h2>Edit ${lc}</h2><label>${S.L[0]} name *</label><input id="en" maxlength="60" style="width:100%" value="${esc(s.name)}"><label>Section (optional)</label><input id="es" maxlength="20" style="width:100%" value="${esc(s.section)}">`,()=>{const name=$('#en').value.trim();if(!name)throw Error(S.L[0]+' name is required');return{name,section:$('#es').value.trim()}});
if(r){await api('sec/'+s.id,'PUT',r);toast('Saved');V.stu()}}));
document.querySelectorAll('#pane [data-x]').forEach(b=>b.onclick=()=>run(async()=>{const s=S.secs.find(x=>x.id==b.dataset.x);
if(await ask(`<h2>Delete ${esc(s.label)}?</h2><p>${s.n?`Its ${s.n} student${s.n==1?'':'s'}, with their attendance and fee records, will be deleted too.`:'It has no students.'} This cannot be undone.</p>`)){await api('sec/'+s.id,'DELETE');const v=SV();if(v.sec==s.id)v.sec='';toast('Deleted');V.stu()}}))}

function stuList(){const v=SV(),adm=isAdm(),lc=S.L[0].toLowerCase();let seq=0,tm=0,last=null;
need('#pane').innerHTML=`<div class="card toolbar"><div class="sbox">${ic('search',17)}<input id="sq" type="search" placeholder="Search name, ID, parent or phone" value="${esc(v.q)}" autocomplete="off"></div><button class="btn p" id="sadd" type="button">${ic('plus',16)}Add student</button><button class="btn" id="simp" type="button">Import</button>${adm?'<button class="btn" id="scol" type="button">Columns</button>':''}</div><div id="sfil"></div><div id="sres"></div>`;
const reload=()=>run(load);
async function load(){const n=++seq,p=new URLSearchParams({inst:S.inst,page:v.page,limit:50}),q=v.q.trim();
 if(q)p.set('q',q);else if(v.view=='class'&&v.cls)p.set('class',v.cls);else if(v.view=='sec'&&v.sec)p.set('sec',v.sec);
 const r=await api('students?'+p);if(n!==seq)return;draw(r)}
function draw(r){last=r;const q=v.q.trim(),G=r.groups,cm=new Map();G.forEach(g=>{const k=g.name.toLowerCase(),e=cm.get(k);e?e.n+=g.n:cm.set(k,{name:g.name,n:g.n})});const classes=[...cm.values()];
 if(!q){ // views that need a selection pick the first one, once
  if(v.view=='class'&&classes.length&&!classes.some(c=>c.name.toLowerCase()==v.cls.toLowerCase())){v.cls=classes[0].name;v.page=1;return load()}
  if(v.view=='sec'&&G.length&&!G.some(g=>g.id==v.sec)){v.sec=G[0].id;v.page=1;return load()}}
 const VW=[['all','All students'],['class',S.L[0]+'-wise'],['sec',S.L[0]+' and section-wise']];
 need('#sfil').innerHTML=`<div class="card"><div class="seg" id="svw">${VW.map(([k,t])=>`<button type="button" data-w="${k}" class="${!q&&v.view==k?'on':''}">${t}</button>`).join('')}</div>
 ${q?`<p class="mut small" style="margin:12px 0 0">Searching all students you can access. <a href="#" id="sclr" style="color:var(--ac);font-weight:600">Clear search</a></p>`
 :v.view=='class'?`<div style="margin-top:12px">${classes.map(c=>`<span class="pill ${c.name.toLowerCase()==v.cls.toLowerCase()?'on':''}" data-cl="${esc(c.name)}">${esc(c.name)} · ${c.n}</span>`).join('')||`<span class="mut">No ${S.L[1].toLowerCase()} yet.</span>`}</div>`
 :v.view=='sec'?`<div style="margin-top:12px">${G.map(g=>`<span class="pill ${g.id==v.sec?'on':''}" data-sc="${g.id}">${esc(g.label)} · ${g.n}</span>`).join('')||`<span class="mut">No ${S.L[1].toLowerCase()} yet.</span>`}</div>`:''}</div>`;
 const rows=r.rows,from=(r.page-1)*r.limit+1,dn=rows.some(x=>x.dup>1);let body;
 if(!G.length)body=`<div class="card">${empty('Create a '+lc+' first',adm?'Open the "'+S.L[1]+' and sections" tab above to add one, then add students.':'You have not been assigned to a '+lc+' yet. Ask your principal.')}</div>`;
 else if(!rows.length)body=`<div class="card">${q?empty('No students found','Try a name, admission number, parent name or phone number.'):empty('No students here yet','Add a student, or import a whole '+lc+' from Excel or Google Sheets.')}</div>`;
 else body=`${q&&dn?`<div class="note warn"><i class="dot warn"></i><span>Some of these students share the same name. Check the ${lc}, section, admission number and parent details to pick the right one.</span></div>`:''}<div class="card"><p class="mut small" style="margin:0 0 6px">${q?`${r.total} match${r.total==1?'':'es'}`:`Showing ${from}-${from+rows.length-1} of ${r.total} student${r.total==1?'':'s'}`}. Tap a row to see the full record.</p>
 <table style="min-width:860px"><tr><th>Admission no.</th><th>Student</th><th>${S.L[0]}</th><th>Section</th><th>Roll no.</th><th>Parent / guardian</th><th>Parent contact</th><th></th></tr>${rows.map(s=>`<tr data-id="${s.id}"><td>${esc(s.adm_no)}</td><td><div class="row" style="gap:0;flex-wrap:nowrap">${av(s.name)}<div><b>${esc(s.name)}</b>${s.dup>1?`<div><span class="tag warn">Same name × ${s.dup}</span></div>`:''}</div></div></td><td>${esc(s.cls)}</td><td>${dsh(s.section)}</td><td>${dsh(s.roll)}</td><td>${dsh(s.parent)}${s.relation?`<div class="mut small">${esc(s.relation)}</div>`:''}</td><td>${esc(fPhone(s.phone))}</td><td><button class="btn sm t" data-vw="${s.id}" type="button">View</button></td></tr>`).join('')}</table>
 ${r.pages>1?`<div class="row" style="justify-content:space-between;margin-top:12px"><span class="mut small">Page ${r.page} of ${r.pages}</span><div class="row"><button class="btn sm" data-pg="${r.page-1}" type="button" ${r.page<=1?'disabled':''}>Previous</button><button class="btn sm" data-pg="${r.page+1}" type="button" ${r.page>=r.pages?'disabled':''}>Next</button></div></div>`:''}</div>`;
 need('#sres').innerHTML=body;
 document.querySelectorAll('#svw [data-w]').forEach(b=>b.onclick=()=>{v.view=b.dataset.w;v.q='';$('#sq').value='';v.page=1;reload()});
 document.querySelectorAll('#sfil [data-cl]').forEach(b=>b.onclick=()=>{v.cls=b.dataset.cl;v.page=1;reload()});
 document.querySelectorAll('#sfil [data-sc]').forEach(b=>b.onclick=()=>{v.sec=+b.dataset.sc;v.page=1;reload()});
 if($('#sclr'))$('#sclr').onclick=e=>{e.preventDefault();v.q='';$('#sq').value='';v.page=1;reload()};
 document.querySelectorAll('#sres [data-pg]').forEach(b=>b.onclick=()=>{v.page=+b.dataset.pg;reload();window.scrollTo({top:0,behavior:'smooth'})});
 document.querySelectorAll('#sres tr[data-id]').forEach(t=>t.onclick=()=>{const s=last.rows.find(x=>x.id==t.dataset.id);if(s)stuView(s,reload)})}
$('#sq').oninput=e=>{v.q=e.target.value;v.page=1;clearTimeout(tm);tm=setTimeout(reload,250)};
$('#sadd').onclick=()=>{if(!mySecs().length)return toast('Create a '+lc+' first');const sc=v.view=='sec'&&v.sec?+v.sec:v.view=='class'&&v.cls?(mySecs().find(s=>s.name.toLowerCase()==v.cls.toLowerCase())||{}).id:null;stuForm(null,reload,sc)};
$('#simp').onclick=()=>{if(!mySecs().length)return toast('Create a '+lc+' first');stuImport(reload)};
if($('#scol'))$('#scol').onclick=()=>colsModal();
reload()}

function stuView(s,done){const adm=isAdm(),rows=[['Admission no.',s.adm_no],[S.L[0],s.cls],['Section',s.section],['Roll no.',s.roll],['Gender',s.gender],['Date of birth',fDate(s.dob)],['Admission date',fDate(s.adm_date)],['Parent / guardian',s.parent+(s.relation?` (${s.relation})`:'')],['Parent contact',fPhone(s.phone)],['Alternate contact',fPhone(s.phone2)],['Address',s.address],...S.cols.map(c=>[c.name,c.type=='date'?fDate((s.extra||{})[c.id]):(s.extra||{})[c.id]])];
const m=modal(`<div class="row" style="flex-wrap:nowrap">${av(s.name)}<div style="min-width:0"><h2 style="overflow-wrap:anywhere">${esc(s.name)}</h2><span class="mut">${esc(s.label)}</span></div></div>
${s.dup>1?`<div class="alert no" style="background:var(--warns);color:var(--warn);border-color:var(--warnb)">${s.dup} students in your view share this name. Use the admission number, ${S.L[0].toLowerCase()} and parent details to tell them apart.</div>`:''}
<dl class="dl">${rows.map(([k,x])=>`<dt>${esc(k)}</dt><dd>${x?esc(x):'<span class="mut">Not set</span>'}</dd>`).join('')}</dl>
<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="vc" type="button">Close</button>${adm?'<button class="btn d" id="vd" type="button">Delete</button>':''}<button class="btn p" id="ve" type="button">${ic('edit',15)}Edit</button></div>`,560);
$('#vc').onclick=()=>m.remove();$('#ve').onclick=()=>{m.remove();stuForm(s,done)};
if($('#vd'))$('#vd').onclick=()=>run(async()=>{if(await ask(`<h2>Delete ${esc(s.name)}?</h2><p>Their details, attendance and fee records are removed permanently.</p>`)){await api('stu/'+s.id,'DELETE');m.remove();toast('Student deleted');done()}})}

function stuForm(st,done,defSec){const adm=isAdm(),edit=!!st,secs=mySecs(),x=st||{},ex=x.extra||{},sel=st?st.sec:(defSec||secs[0]?.id);
const fld=(l,h,full)=>`<div${full?' style="grid-column:1/-1"':''}><label>${l}</label>${h}</div>`,val=k=>esc(x[k]??''),opt=(a,c)=>`<option value=""></option>${a.map(o=>`<option ${o==c?'selected':''}>${o}</option>`).join('')}`;
const cx=c=>{const t=ex[c.id]??'';return fld(esc(c.name),c.type=='dropdown'?`<select data-x="${c.id}"><option value=""></option>${c.opts.map(o=>`<option ${o==t?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input data-x="${c.id}" type="${c.type=='date'?'date':'text'}" ${c.type=='number'?'inputmode="decimal"':''} value="${esc(t)}">`)};
const m=modal(`<h2>${edit?'Edit student':'Add student'}</h2><p class="mut small" style="margin:2px 0 0">Fields marked * are required.</p><div id="fe"></div>
<h3>Student</h3><div class="grid">${fld('Student name *',`<input id="f_name" maxlength="80" value="${val('name')}" autocomplete="off">`)}${fld('Admission no. / Student ID',`<input id="f_adm" maxlength="30" value="${val('adm_no')}" placeholder="Auto-generated if left empty" autocomplete="off">`)}
${fld(S.L[0]+' and section *',`<select id="f_sec" ${adm?'':'disabled'}>${secs.map(s=>`<option value="${s.id}" ${s.id==sel?'selected':''}>${esc(s.label)}</option>`).join('')}</select>`)}${fld('Roll no.',`<input id="f_roll" maxlength="10" value="${val('roll')}" autocomplete="off">`)}
${fld('Gender',`<select id="f_gen">${opt(GEN,x.gender)}</select>`)}${fld('Date of birth',`<input id="f_dob" type="date" max="${td()}" value="${val('dob')}">`)}${fld('Admission date',`<input id="f_ad" type="date" value="${val('adm_date')}">`)}</div>
<h3>Parent / guardian</h3><div class="grid">${fld('Parent / guardian name *',`<input id="f_par" maxlength="80" value="${val('parent')}" autocomplete="off">`)}${fld('Relationship',`<select id="f_rel">${opt(REL,x.relation)}</select>`)}
${fld('Parent contact number *',`<input id="f_ph" inputmode="tel" maxlength="20" value="${esc(lPhone(x.phone))}" placeholder="10-digit mobile number" autocomplete="off">`)}${fld('Alternate contact number',`<input id="f_ph2" inputmode="tel" maxlength="20" value="${esc(lPhone(x.phone2))}" autocomplete="off">`)}
${fld('Address',`<textarea id="f_addr" maxlength="300" style="min-height:70px">${val('address')}</textarea>`,true)}</div>
${S.cols.length?`<h3>More details</h3><div class="grid">${S.cols.map(cx).join('')}</div>`:''}
<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="fc" type="button">Cancel</button>${edit?'':'<button class="btn t" id="fa" type="button">Save and add another</button>'}<button class="btn p" id="fs" type="button">${edit?'Save changes':'Save student'}</button></div>`);
const er=t=>{$('#fe').innerHTML=t?`<div class="alert no" role="alert">${esc(t)}</div>`:'';if(t)m.firstElementChild.scrollTo({top:0,behavior:'smooth'})};
const save=again=>async()=>{er('');const g=id=>m.querySelector('#'+id).value.trim(),b={name:g('f_name'),adm_no:g('f_adm'),sec:+m.querySelector('#f_sec').value,roll:g('f_roll'),gender:m.querySelector('#f_gen').value,dob:g('f_dob'),adm_date:g('f_ad'),parent:g('f_par'),relation:m.querySelector('#f_rel').value,phone:g('f_ph'),phone2:g('f_ph2'),address:g('f_addr'),extra:{}};
 m.querySelectorAll('[data-x]').forEach(e=>b.extra[e.dataset.x]=e.value);
 if(!b.name)return er('Student name is required');if(!b.sec)return er('Choose a '+S.L[0].toLowerCase());if(!b.parent)return er('Parent or guardian name is required');if(b.phone.replace(/\D/g,'').length<10)return er('Enter a valid parent contact number');
 m.querySelectorAll('.btn').forEach(k=>k.disabled=true);
 try{const r=edit?await api('stu/'+st.id,'PUT',b):await api('stu','POST',b);m.remove();toast(edit?'Student saved':'Student added'+(r.adm_no&&!b.adm_no?' (ID '+r.adm_no+')':''));done();if(again)stuForm(null,done,b.sec)}
 catch(e){m.querySelectorAll('.btn').forEach(k=>k.disabled=false);if(e)er(e.message)}};
m.addEventListener('input',()=>{if($('#fe').firstChild)er('')});$('#fc').onclick=()=>m.remove();$('#fs').onclick=save(false);if($('#fa'))$('#fa').onclick=save(true);m.querySelector('#f_name').focus()}

function stuImport(done){const adm=isAdm(),secs=mySecs(),v=SV(),sel=v.view=='sec'&&v.sec?+v.sec:secs[0]?.id;
const m=modal(`<h2>Import students</h2><p class="mut small" style="margin:2px 0 0">Copy rows from Excel or Google Sheets and paste them below, one student per line. A heading row is optional. Column order:</p>
<p class="small" style="margin:8px 0 0"><b>Name | Parent contact | Roll no. | Admission no. | Parent / guardian name | Gender | Date of birth | Address${S.cols.map(c=>' | '+esc(c.name)).join('')}</b></p><p class="mut small" style="margin:4px 0 0">Name, parent contact and parent name are required. Leave the admission number empty to have one generated. Dates can be DD/MM/YYYY.</p>
<label>${S.L[0]} and section</label><select id="i_sec" style="width:100%" ${adm?'':'disabled'}>${secs.map(s=>`<option value="${s.id}" ${s.id==sel?'selected':''}>${esc(s.label)}</option>`).join('')}</select>
<label>Students</label><textarea id="i_tx" style="min-height:150px" placeholder="Rahul Sharma&#9;9876543210&#9;1&#9;ADM-101&#9;Suresh Sharma&#9;Male&#9;12/05/2014"></textarea><div id="ir"></div>
<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="ic2" type="button">Close</button><button class="btn p" id="ig" type="button">Import students</button></div>`);
$('#ic2').onclick=()=>m.remove();
$('#ig').onclick=async()=>{const t=m.querySelector('#i_tx').value;if(!t.trim()){m.querySelector('#ir').innerHTML='<div class="alert no">Paste some rows first.</div>';return}
 const b=$('#ig');b.disabled=true;b.innerHTML='<span class="spin"></span>Importing';
 try{const r=await api('stu/bulk','POST',{sec:+m.querySelector('#i_sec').value,text:t});done();
  m.querySelector('#ir').innerHTML=`<div class="alert ${r.added?'':'no'}" style="${r.added?'background:var(--oks);color:var(--ok);border-color:var(--okb)':''}">${r.added} student${r.added==1?'':'s'} added${r.skipped?`, ${r.skipped} skipped`:''}.</div>${r.errors.length?`<ul class="small" style="margin:8px 0 0;padding-left:18px">${r.errors.map(e=>`<li>Line ${e.line}${e.name?' ('+esc(e.name)+')':''}: ${esc(e.msg)}</li>`).join('')}</ul>${r.skipped>r.errors.length?`<p class="mut small">Showing the first ${r.errors.length} problems.</p>`:''}`:''}`;
  const L=t.split('\n');m.querySelector('#i_tx').value=r.failed.map(n=>L[n-1]).join('\n');b.disabled=false;b.textContent=r.failed.length?'Import again':'Import more'}
 catch(e){b.disabled=false;b.textContent='Import students';if(e)m.querySelector('#ir').innerHTML=`<div class="alert no">${esc(e.message)}</div>`}}}

/* ===== Principal management (Phase 4) ===== */
const TV=()=>S.tv||(S.tv={tab:'dash',f:'all',q:'',tq:'',tf:'all'});
const tn=t=>t.name||t.username;
const MGA=['created account','assigned teacher','unassigned teacher','updated teacher details','changed username','reset password','enabled account','disabled account','deleted account'];
const warnBox=a=>a.map(x=>`<div class="alert warn">${esc(x)}</div>`).join('');
const tOpt=(t,sel)=>`<option value="${t.id}" ${t.id==sel?'selected':''}>${esc(tn(t))} (@${esc(t.username)}) · ${t.sec?'now in '+esc(t.sec_label):'no class yet'}</option>`;
const actT=c=>c.teachers.filter(t=>t.active);
function credModal(name,un,pw){const txt=`${dname(cur())}\nTeacher: ${name}\nSign in: ${location.origin}\nUsername: ${un}\n${pw?'Password: '+pw:'Password: unchanged'}`;
const m=modal(`<div class="row" style="gap:14px;flex-wrap:nowrap"><span class="fi" style="background:linear-gradient(145deg,#34d27b,#15803d)">${ic('check',20)}</span><div><h2>Login details ready</h2><p class="mut" style="margin:2px 0 0">Share these with the teacher.${pw?' The password is shown only now.':''}</p></div></div><div class="cred">${esc(txt)}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="cdn" type="button">Done</button><button class="btn p" id="ccp" type="button">${ic('copy',15)}Copy details</button></div>`,520);
$('#ccp').onclick=()=>copyText(txt);$('#cdn').onclick=()=>m.remove()}

async function mgAssignClass(c){const T=S.mg.teachers.filter(t=>t.active),cur_=actT(c);if(!T.length){toast('Add a teacher account first');return}
const p=ask(`<h2>${cur_.length?'Change':'Assign'} class teacher</h2><p class="mut small" style="margin:2px 0 0">${esc(c.label)} · ${c.students} student${c.students==1?'':'s'}</p><label>Class teacher</label><select id="as_t" style="width:100%"><option value="">${cur_.length?'No class teacher':'Choose a teacher'}</option>${T.map(t=>tOpt(t,cur_.length==1?cur_[0].id:'')).join('')}</select><div id="as_w"></div>`,()=>{const tid=+$('#as_t').value;if(!tid&&!cur_.length)throw Error('Choose a teacher');return{tid}});
const warn=()=>{const tid=+$('#as_t').value,t=T.find(x=>x.id==tid),w=[];if(t&&t.sec&&t.sec!=c.id)w.push(`${tn(t)} currently teaches ${t.sec_label}. That class will be left without a class teacher.`);
 const out=cur_.filter(x=>x.id!=tid);if(out.length)w.push(`${out.map(tn).join(', ')} will lose access to ${c.label} and its students.`);$('#as_w').innerHTML=warnBox(w)};
$('#as_t').onchange=warn;warn();const r=await p;if(!r)return;
if(r.tid){if(cur_.length==1&&cur_[0].id==r.tid)return;await api('users/'+r.tid,'PUT',{sec:c.id,replace:true})}else for(const t of cur_)await api('users/'+t.id,'PUT',{sec:null});
toast('Class teacher updated');V.team()}

async function mgAssignTeacher(t){const C=S.mg.classes;if(!C.length){toast('Create a '+S.L[0].toLowerCase()+' first under Students');return}
const p=ask(`<h2>${t.sec?'Change':'Assign'} class</h2><p class="mut small" style="margin:2px 0 0">${esc(tn(t))} (@${esc(t.username)})</p><label>${S.L[0]} and section</label><select id="as_c" style="width:100%"><option value="">No class</option>${C.map(c=>`<option value="${c.id}" ${c.id==t.sec?'selected':''}>${esc(c.label)} · ${actT(c).filter(x=>x.id!=t.id).map(tn).join(', ')||'no teacher yet'}</option>`).join('')}</select><div id="as_w"></div>`,()=>({sec:+$('#as_c').value||0}));
const warn=()=>{const id=+$('#as_c').value,c=C.find(x=>x.id==id),w=[];if(c){const o=actT(c).filter(x=>x.id!=t.id);if(o.length)w.push(`${o.map(tn).join(', ')} will lose access to ${c.label} and its students.`)}else if(t.sec)w.push(`${tn(t)} will lose access to ${t.sec_label} and will not see any students.`);$('#as_w').innerHTML=warnBox(w)};
$('#as_c').onchange=warn;warn();const r=await p;if(!r)return;if(r.sec===(t.sec||0))return;
await api('users/'+t.id,'PUT',{sec:r.sec||null,replace:true});toast('Class updated');V.team()}

<div class="grid"><div><label>Full name</label><input id="n_nm" maxlength="60" autocomplete="off"></div><div><label>${S.L[0]} and section</label><select id="n_sec"><option value="">Assign later</option>${C.map(c=>`<option value="${c.id}" ${c.id==pre?'selected':''}>${esc(c.label)} · ${actT(c).map(tn).join(', ')||'no teacher yet'}</option>`).join('')}</select></div>
<div><label>Username *</label><input id="n_un" maxlength="30" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div><div><label>Password * (min 6)</label><div class="pw"><input id="n_pw" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"><button type="button" class="ib" id="n_g" title="Generate a password" aria-label="Generate a password">${ic('key',18)}</button></div></div></div><div id="n_w"></div>
<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="n_c" type="button">Cancel</button><button class="btn p" id="n_s" type="button">Create teacher</button></div>`,640);
const er=t=>{$('#fe').innerHTML=t?`<div class="alert no" role="alert">${esc(t)}</div>`:''},q=s=>m.querySelector(s);q('#n_pw').value=genPw();q('#n_g').onclick=()=>{q('#n_pw').value=genPw()};
const warn=()=>{const c=C.find(x=>x.id==+q('#n_sec').value),o=c?actT(c):[];q('#n_w').innerHTML=o.length?warnBox([`${o.map(tn).join(', ')} will lose access to ${c.label}. This new teacher becomes its class teacher.`]):''};q('#n_sec').onchange=warn;warn();
m.addEventListener('input',()=>{if(q('#fe').firstChild)er('')});q('#n_c').onclick=()=>m.remove();
q('#n_s').onclick=async()=>{const b={inst:S.inst,role:'staff',name:q('#n_nm').value.trim(),username:q('#n_un').value.trim().toLowerCase(),password:q('#n_pw').value,sec:+q('#n_sec').value||null,replace:true};
 if(!b.username)return er('Choose a username');if(b.password.trim().length<6)return er('Password must be at least 6 characters');
 m.querySelectorAll('.btn').forEach(k=>k.disabled=true);
 try{await api('users','POST',b);m.remove();toast('Teacher created');credModal(b.name||b.username,b.username,b.password.trim());V.team()}catch(e){m.querySelectorAll('.btn').forEach(k=>k.disabled=false);if(e)er(e.message)}};q('#n_nm').focus()}

function mgEdit(t){const m=modal(`<h2>Edit login</h2><p class="mut small" style="margin:2px 0 0">Changing the username or password signs ${esc(tn(t))} out of every device.</p><div id="fe"></div>
<div class="grid"><div><label>Full name</label><input id="e_nm" maxlength="60" value="${esc(tn(t))}" autocomplete="off"></div><div><label>Username</label><input id="e_un" maxlength="30" value="${esc(t.username)}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div>
<div style="grid-column:1/-1"><label>New password <span class="mut">(leave empty to keep the current one)</span></label><div class="pw"><input id="e_pw" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"><button type="button" class="ib" id="e_g" title="Generate a password" aria-label="Generate a password">${ic('key',18)}</button></div></div></div>
<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="e_c" type="button">Cancel</button><button class="btn p" id="e_s" type="button">Save changes</button></div>`,560);
const er=x=>{$('#fe').innerHTML=x?`<div class="alert no" role="alert">${esc(x)}</div>`:''},q=s=>m.querySelector(s);q('#e_g').onclick=()=>{q('#e_pw').value=genPw()};m.addEventListener('input',()=>{if(q('#fe').firstChild)er('')});q('#e_c').onclick=()=>m.remove();
q('#e_s').onclick=async()=>{const nm=q('#e_nm').value.trim(),un=q('#e_un').value.trim().toLowerCase(),pw=q('#e_pw').value,b={};

 if(nm!==tn(t))b.name=nm;if(un!==t.username)b.username=un;if(pw)b.password=pw.trim();if(!Object.keys(b).length){m.remove();return}

async function mgReset(t){if(!await ask(`<h2>Reset password?</h2><p>A new password is generated for ${esc(tn(t))}. Their current password stops working and they are signed out of every device.</p>`))return;
const pw=genPw();await api('users/'+t.id,'PUT',{password:pw});V.team();credModal(tn(t),t.username,pw)}
async function mgToggle(t){const on=!t.active;if(!await ask(`<p>${on?`Enable ${esc(tn(t))}'s login? They can sign in again${t.sec?' and will see '+esc(t.sec_label):''}.`:`Disable ${esc(tn(t))}'s login? They are signed out immediately and cannot sign in until you enable it again. Their class assignment is kept.`}</p>`))return;
try{await api('users/'+t.id,'PUT',{active:on})}catch(e){if(e&&/another active class teacher/.test(e.message)&&await ask(`<h2>Replace the current class teacher?</h2><p>${esc(e.message)}</p>`)){await api('users/'+t.id,'PUT',{active:true,replace:true})}else throw e}
toast(on?'Login enabled':'Login disabled');V.team()}
async function mgDelete(t){if(!await ask(`<h2>Delete ${esc(tn(t))}'s login?</h2><p>The account is deleted permanently${t.sec?' and '+esc(t.sec_label)+' is left without a class teacher':''}. Students and their records are not affected.</p>`))return;await api('users/'+t.id,'DELETE');toast('Login deleted');V.team()}

async function mgDash(){const d=S.mg,v=TV(),C=d.classes,T=d.teachers,lc=S.L[0].toLowerCase(),plu=S.L[1].toLowerCase();
const acts=(await api('activity?limit=200&inst='+S.inst)).filter(a=>MGA.includes(a.action)).slice(0,8);

${notes.map(n=>`<div class="note ${n[0]}"><i class="dot ${n[0]=='warn'?'warn':'ac'}"></i><span>${n[1]}</span><button class="btn sm" data-n="${n[2]}" type="button">${n[3]}</button></div>`).join('')}
<div class="card toolbar"><div class="sbox">${ic('search',17)}<input id="mq" type="search" placeholder="Search ${lc}, section or teacher" value="${esc(v.q)}" autocomplete="off"></div><div class="seg" id="mf">${[['all','All'],['none','No teacher']].map(([k,t])=>`<button type="button" data-f="${k}" class="${v.f==k?'on':''}">${t}</button>`).join('')}</div><button class="btn p" id="mnew" type="button">${ic('plus',16)}Add teacher</button></div>

<div class="cols2"><div class="card"><h2>${S.me.role=='super'?'Principal / director login':(cur().type=='schl'?'Principal':'Director')+' login'}</h2>${d.heads.map((h,n)=>`<div class="irow ${n?'':'first'}">${av(h.name||h.username)}<div class="sp"><b>${esc(h.name||h.username)}</b><div class="mut small">@${esc(h.username)} · Last sign-in: ${when(h.last_login)}</div></div><span class="tag ${h.active?'ok':'no'}">${h.active?'Active':'Disabled'}</span></div>`).join('')||'<p class="mut">No head login.</p>'}<p class="mut small" style="margin:10px 0 0">${S.me.role=='super'?'Manage head logins from Institutes, then Access.':'Only the administrator can change this login.'}</p></div>
<div class="card"><h2>Recent changes</h2>${acts.length?`<table style="min-width:0">${acts.map(a=>`<tr><td><b>${esc(a.action)}</b><div class="mut small">${esc(a.detail)}</div></td><td class="mut small" style="white-space:nowrap">${when(a.ts)}</td></tr>`).join('')}</table>`:empty('Nothing yet','Assignments and login changes appear here.')}</div></div>`;
const draw=()=>{const q=v.q.trim().toLowerCase(),rows=C.filter(c=>(v.f=='all'||!actT(c).length)&&(!q||[c.label,...c.teachers.map(t=>tn(t)+' '+t.username)].join(' ').toLowerCase().includes(q)));$('#mcnt').textContent=rows.length==C.length?`${C.length} total`:`${rows.length} of ${C.length}`;
 $('#mtb').innerHTML=!C.length?empty('No '+plu+' yet','Create one under Students, then assign a class teacher here.'):rows.length?`<table style="min-width:900px"><tr><th>${S.L[0]}</th><th>Section</th><th>Class teacher</th><th>Status</th><th>Students</th><th>Last sign-in</th><th></th></tr>${rows.map(c=>{const a=actT(c),last=c.teachers.map(t=>t.last_login||'').sort().pop();
  return `<tr><td><b>${esc(c.name)}</b></td><td>${c.section?esc(c.section):'<span class="mut">None</span>'}</td><td>${c.teachers.length?c.teachers.map(t=>`<div class="row" style="gap:0;flex-wrap:nowrap;margin:2px 0">${av(tn(t))}<div><b>${esc(tn(t))}</b><div class="mut small">@${esc(t.username)}${t.active?'':' · disabled'}</div></div></div>`).join(''):'<span class="mut">No class teacher</span>'}</td>
  <td>${a.length?'<span class="tag ok">Assigned</span>':c.teachers.length?'<span class="tag no">Teacher disabled</span>':'<span class="tag warn">Not assigned</span>'}</td><td>${c.students}</td><td class="mut">${last?when(last):'-'}</td>
  <td><div class="row"><button class="btn sm ${a.length?'':'p'}" data-ac="${c.id}" type="button">${a.length?'Change teacher':'Assign teacher'}</button>${a.length?'':`<button class="btn sm" data-nt="${c.id}" type="button">New teacher</button>`}</div></td></tr>`}).join('')}</table>`:empty('Nothing matches','Try a different search.');
 document.querySelectorAll('#mtb [data-ac]').forEach(b=>b.onclick=()=>run(()=>mgAssignClass(C.find(c=>c.id==b.dataset.ac))));document.querySelectorAll('#mtb [data-nt]').forEach(b=>b.onclick=()=>mgCreate(+b.dataset.nt))};
$('#mq').oninput=e=>{v.q=e.target.value;draw()};document.querySelectorAll('#mf [data-f]').forEach(b=>b.onclick=()=>{v.f=b.dataset.f;document.querySelectorAll('#mf [data-f]').forEach(x=>x.classList.toggle('on',x==b));draw()});

function mgTeachers(){const d=S.mg,v=TV(),T=d.teachers,lc=S.L[0].toLowerCase();
need('#pane').innerHTML=`<div class="card toolbar"><div class="sbox">${ic('search',17)}<input id="tq" type="search" placeholder="Search by name or username" value="${esc(v.tq)}" autocomplete="off"></div><div class="seg" id="tf">${[['all','All'],['on','Active'],['off','Disabled'],['none','No '+lc]].map(([k,t])=>`<button type="button" data-f="${k}" class="${v.tf==k?'on':''}">${t}</button>`).join('')}</div><button class="btn p" id="tnew" type="button">${ic('plus',16)}Add teacher</button></div><p class="mut small" id="tcnt" style="margin:0 2px 12px"></p><div id="tl"></div>`;

  <div class="row"><button class="btn sm t" data-a="${t.id}" type="button">${t.sec?'Change '+lc:'Assign '+lc}</button><button class="btn sm" data-e="${t.id}" type="button">Edit login</button><button class="btn sm" data-r="${t.id}" type="button">Reset password</button><button class="btn sm" data-t="${t.id}" type="button">${t.active?'Disable':'Enable'}</button><button class="btn sm d" data-d="${t.id}" type="button">Delete</button></div></div>`).join('')}</div>`:`<div class="card">${empty('No teachers match','Try a different search or filter.')}</div>`;
 const by=a=>T.find(t=>t.id==a);for(const [k,f] of [['a',mgAssignTeacher],['r',mgReset],['t',mgToggle],['d',mgDelete]])document.querySelectorAll(`#tl [data-${k}]`).forEach(b=>b.onclick=()=>run(()=>f(by(b.dataset[k]))));document.querySelectorAll('#tl [data-e]').forEach(b=>b.onclick=()=>mgEdit(by(b.dataset.e)))};

$('#ca').onclick=()=>run(async()=>{const b={inst:S.inst,name:$('#cn').value,type:$('#ct').value,opts:$('#cop').value};if(await ask(`<p>Add column "${esc(b.name)}"?</p>`)){await api('cols','POST',b);S.cols=await api('cols?inst='+S.inst);draw();toast('Column added')}});
v.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>run(async()=>{const c=S.cols.find(x=>x.id==b.dataset.rn);const r=await ask(`<h2>Edit column</h2><label>Name</label><input id="rn" style="width:100%" value="${esc(c.name)}">${c.type=='dropdown'?`<label>Options (one per line)</label><textarea id="ro" style="min-height:80px">${esc(c.opts.join('\n'))}</textarea>`:''}`,()=>({name:$('#rn').value,opts:c.type=='dropdown'?$('#ro').value:''}));if(r){await api('cols/'+c.id,'PUT',r);S.cols=await api('cols?inst='+S.inst);draw()}}));

function actHtml(list,showInst){return `<div class="card"><h2>Activity</h2><p class="mut">Latest 200 actions.</p><table><tr><th>Time</th><th>User</th>${showInst?'<th>Institute</th>':''}<th>Action</th><th>Details</th></tr>${list.map(a=>`<tr><td class="mut">${when(a.ts)}</td><td>${esc(a.uname)}<br><span class="mut">${esc(a.role)}</span></td>${showInst?`<td>${esc(a.inst_name||'-')}</td>`:''}<td>${esc(a.action)}</td><td class="mut">${esc(a.detail)}</td></tr>`).join('')}</table></div>`}
