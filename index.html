function sheet(rows){const sn=S.secs.find(s=>s.id==S.sec)?.name||'';
const C=[{k:'name',l:'Name'},{k:'phone',l:'Parent number'},{k:'roll',l:'Roll no.'},...S.cols.map(c=>({k:'x'+c.id,l:c.name,t:c.type,o:c.opts}))];
const val=(r,c)=>c.k[0]=='x'?((r.extra||{})[c.k.slice(1)]??''):(r[c.k]??'');
const cell=(c,v)=>{const a=`data-c="${c.k}"`;if(c.t=='dropdown')return `<select ${a}><option value=""></option>${c.o.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;return `<input ${a} type="${c.t=='date'?'date':'text'}" ${c.t=='number'?'inputmode="decimal"':c.k=='phone'?'inputmode="tel"':''} value="${esc(v)}">`};
const tr=(r,d)=>`<tr data-row="${r.id}" class="${d?'dirty':''}">${C.map(c=>`<td>${cell(c,val(r,c))}</td>`).join('')}<td><button class="btn sm d" data-del>Delete</button></td></tr>`;
need('#box').innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">${esc(sn)} · ${rows.length} students</h2><button class="btn sm" id="cl">Columns</button><button class="btn sm" id="ar">Add row</button><button class="btn p" id="sv" disabled>Save changes</button></div><p class="mut">Tap any cell to edit. Changed rows turn yellow. Press Save changes when you are done.</p>
<div class="sheet"><table style="min-width:${C.length*160+90}px"><tr>${C.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th></th></tr><tbody id="tb">${rows.map(r=>tr(r)).join('')}</tbody></table></div></div>
<div class="card"><h2>Paste from Excel or Google Sheets</h2><p class="mut">Copy the rows (without a heading row) and paste them here. Column order: ${C.map(c=>esc(c.l)).join(' | ')}</p><textarea id="bk" placeholder="Rahul Sharma&#9;9876543210&#9;1"></textarea><div style="margin-top:10px"><button class="btn p" id="ba">Import students</button></div></div>`;
const dirty=new Set(),tb=$('#tb');let dn=0;const upd=()=>{$('#sv').disabled=!dirty.size;$('#sv').textContent=dirty.size?`Save changes (${dirty.size})`:'Save changes'};
const mk=e=>{const r=e.target.closest('tr[data-row]');if(r){dirty.add(r);r.classList.add('dirty');upd()}};tb.addEventListener('input',mk);tb.addEventListener('change',mk);
tb.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;const r=b.closest('tr');run(async()=>{const id=r.dataset.row;if(await ask('<h2>Delete this student?</h2><p>Their details and attendance are removed.</p>')){if(id[0]!='n')await api('stu/'+id,'DELETE');dirty.delete(r);r.remove();upd();toast('Deleted')}})});
$('#ar').onclick=()=>{tb.insertAdjacentHTML('afterbegin',tr({id:'n'+(++dn)},true));const r=tb.firstElementChild;dirty.add(r);upd();r.querySelector('input').focus()};
$('#cl').onclick=()=>{if(dirty.size){toast('Save your changes first');return}colsModal()};
$('#sv').onclick=()=>run(async()=>{if(!await ask(`<h2>Save ${dirty.size} change(s)?</h2><p>The student details will be updated.</p>`))return;
for(const r of [...dirty]){const o={extra:{}};r.querySelectorAll('[data-c]').forEach(e=>{const k=e.dataset.c;if(k[0]=='x')o.extra[k.slice(1)]=e.value;else o[k]=e.value});const id=r.dataset.row;
try{if(id[0]=='n')r.dataset.row=(await api('stu','POST',{...o,sec:S.sec})).id;else await api('stu/'+id,'PUT',o)}catch(e){toast((o.name||'Row')+': '+(e&&e.message));upd();return}
dirty.delete(r);r.classList.remove('dirty');upd()}toast('Saved');V.stu()});
$('#ba').onclick=()=>run(async()=>{if(!$('#bk').value.trim())throw Error('Paste some rows first');if(await ask('<p>Import these students?</p>')){const r=await api('stu/bulk','POST',{sec:S.sec,text:$('#bk').value});toast(r.added+' added'+(r.skipped?`, ${r.skipped} skipped (check the number or a required field)`:''));V.stu()}})}
