<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Institute Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens ---------- */
:root{--ac:#2563eb;--acs:color-mix(in srgb,var(--ac) 9%,#fff);--ink:#0f172a;--ink2:#334155;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc;--card:#fff;
--ok:#15803d;--oks:#ecfdf3;--warn:#b45309;--warns:#fffbeb;--no:#b91c1c;--nos:#fef2f2;--r:14px;--sh:0 1px 2px #0f172a0d,0 1px 1px #0f172a08;--t:.16s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:84px}
h1,h2{margin:0;font-weight:600;letter-spacing:-.02em}h1{font-size:24px;line-height:1.2}h2{font-size:16px}
.mut{color:var(--mut)}.ok{color:var(--ok)}.no{color:var(--no)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
/* ---------- Shell: sidebar + minimal top bar ---------- */
.shell{min-height:100vh}.side{display:none}
.col{min-width:0}.top{display:flex;gap:10px;align-items:center;padding:10px 16px;position:sticky;top:0;z-index:5;background:#ffffffeb;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tl{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}.tl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.logo{width:22px;height:22px;border-radius:7px;background:var(--ink);display:inline-block;flex:none;position:relative}.logo:after{content:'';position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:3px;background:var(--ac)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px}.pagehead{margin-bottom:18px}.pagehead p{margin:4px 0 0;color:var(--mut)}
#main{animation:fade .2s ease both}
@media(min-width:960px){body{padding-bottom:24px}.side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:248px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;z-index:6}
.col{margin-left:248px}.tl{display:none}.top{justify-content:flex-end;padding:10px 28px}.wrap{padding:28px}.bnav{display:none!important}}
.sbrand{display:flex;align-items:center;gap:10px;font-weight:600;padding:6px 10px 16px;font-size:15px}.sbrand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side nav{flex:1;overflow:auto}.sg{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:14px 10px 6px}
.sitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink2);font-weight:500;cursor:pointer;transition:background var(--t),color var(--t)}
.sitem:hover{background:#f1f5f9}.sitem.on{background:var(--acs);color:var(--ac);font-weight:600}.sitem svg{flex:none}
.suser{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);margin-top:8px;cursor:pointer;border-radius:10px}.suser:hover{background:#f1f5f9}.suser b{display:block;font-size:13.5px;line-height:1.2}.suser span{font-size:12px;color:var(--mut)}
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.bnav span{flex:1;text-align:center;color:var(--mut);padding:6px 0;border-radius:10px;cursor:pointer;font-size:10.5px;font-weight:600;line-height:1.2;transition:color var(--t)}.bnav svg{display:block;margin:0 auto 2px}.bnav span.on{color:var(--ac)}
/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 16px;box-shadow:var(--sh);overflow-x:auto}.card>h2:first-child{margin-bottom:2px}
.cols2{display:grid;gap:16px;grid-template-columns:1fr;margin-bottom:16px}.cols2 .card{margin:0}@media(min-width:900px){.cols2{grid-template-columns:1fr 1fr}.cols2.w{grid-template-columns:1.5fr 1fr}}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 18px;font:inherit;font-weight:600;cursor:pointer;transition:background var(--t),border-color var(--t),transform var(--t);display:inline-flex;align-items:center;gap:8px;line-height:1.3}
.btn:hover{background:#f1f5f9;border-color:#cbd5e1}.btn:active{transform:scale(.98)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:color-mix(in srgb,var(--ac) 88%,#000);border-color:transparent}
.btn.t{background:var(--acs);border-color:transparent;color:var(--ac)}.btn.t:hover{background:color-mix(in srgb,var(--ac) 16%,#fff)}
.btn.d{color:var(--no);border-color:#fecaca;background:#fff}.btn.d:hover{background:var(--nos);border-color:#fca5a5}.btn.dr{background:var(--no);border-color:var(--no);color:#fff}.btn.dr:hover{background:#991b1b}
.btn.sm{padding:4px 13px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tg{border:1px solid transparent;border-radius:999px;padding:5px 14px;font:600 13px Inter,system-ui;cursor:pointer;min-width:92px;transition:background var(--t)}.tg.p{background:var(--oks);color:var(--ok);border-color:#bbf7d0}.tg.a{background:var(--nos);color:var(--no);border-color:#fecaca}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 14px;margin:0 6px 6px 0;cursor:pointer;font-weight:500;background:#fff;transition:all var(--t)}.pill:hover{border-color:#cbd5e1}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}.pill.lock{opacity:.5;cursor:not-allowed}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;color:#fff;font-weight:600;font-size:13px;margin-right:10px;vertical-align:middle;flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px 3px 3px;font:600 13px Inter,system-ui;cursor:pointer;color:var(--ink);transition:background var(--t)}.chip:hover{background:#f1f5f9}.chip .av{margin:0;width:26px;height:26px;font-size:12px}
input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);max-width:100%;transition:border-color var(--t),box-shadow var(--t)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}input:disabled{background:#f1f5f9;color:var(--mut)}
textarea{width:100%;min-height:120px}label{display:block;font-weight:600;margin:12px 0 4px;font-size:13px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;min-width:420px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:11.5px;letter-spacing:.05em;color:var(--mut);text-transform:uppercase;font-weight:600}tbody tr:hover td,tr:hover>td{background:#f8fafc}
tr.abs td{background:var(--nos)}tr.dirty td{background:var(--warns)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:#f1f5f9;color:var(--ink2);white-space:nowrap}.tag.ok{background:var(--oks);color:var(--ok)}.tag.no{background:var(--nos);color:var(--no)}.tag.warn{background:var(--warns);color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.tile{border-radius:12px;padding:14px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:border-color var(--t),box-shadow var(--t)}.tile:hover{border-color:#cbd5e1}.tile b{display:block;font-size:15px}.tile.me{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 14%,transparent)}.tile.lock{opacity:.55;cursor:not-allowed}
.mc{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-weight:600;background:#fff;transition:border-color var(--t)}.mc:hover{border-color:#cbd5e1}.mc svg{color:var(--ac)}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:10px}.pcard.empty{flex-direction:row;align-items:center;justify-content:space-between;background:#f8fafc;border-style:dashed}
.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.clsrow{padding:14px 0;border-top:1px solid var(--line)}.clsname{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.sheet{overflow-x:auto}.sheet input,.sheet select{width:100%;min-width:130px;padding:6px 9px;border-radius:8px}
.pw{display:flex;align-items:center;gap:2px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding-right:4px;transition:border-color var(--t),box-shadow var(--t)}.pw:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}.pw input{border:0;flex:1;min-width:0;background:transparent;box-shadow:none!important}
.ib{border:0;background:none;color:var(--mut);padding:6px;cursor:pointer;display:grid;place-items:center;border-radius:8px}.ib:hover{color:var(--ink);background:#f1f5f9}
.bar2{height:8px;border-radius:99px;background:#e2e8f0;margin-top:10px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .5s ease}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}.kl{display:block;color:var(--mut);font-size:13px;font-weight:500}.kpi b{display:block;font-size:28px;font-weight:600;letter-spacing:-.02em;margin:4px 0 2px}.kc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:#94a3b8;display:inline-block}.dot.ok{background:#22c55e}.dot.no{background:#ef4444}.dot.warn{background:#f59e0b}.dot.ac{background:var(--ac)}
.note{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:10px}.note .dot{flex:none}.note span{flex:1}.note.warn{background:var(--warns);border-color:#fde68a}.note.info{background:var(--acs);border-color:color-mix(in srgb,var(--ac) 22%,#fff)}
.chart{width:100%;height:auto;display:block;margin-top:8px}.gl{stroke:#e2e8f0;stroke-width:1}.gt{fill:#64748b;font:11px Inter,system-ui}.ln{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ar{fill:var(--ac);opacity:.07}.dt{fill:#fff;stroke:var(--ac);stroke-width:2}.bar{fill:var(--ac);opacity:.85}
.qt{flex:1 1 100%}@media(min-width:700px){.qt{flex:1 1 auto}}
.empty-s{padding:26px 8px;text-align:center;color:var(--mut)}
/* login */
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}.lgc{width:100%;max-width:400px;padding:28px;margin:0}.lgm{margin-bottom:18px}.lgc h1{font-size:22px}.lgc p{margin:6px 0 4px}
/* overlays */
.veil{position:fixed;inset:0;background:#0f172a8c;display:grid;place-items:center;z-index:9;animation:fade .15s ease both}.veil .card{max-width:420px;width:92%;margin:0;animation:pop .18s ease both;box-shadow:0 20px 50px -20px #0f172a99}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px;z-index:10;display:none;max-width:92vw;text-align:center;font-weight:500}
@media(min-width:960px){#toast{bottom:28px}}
body.busy:before{content:'';position:fixed;top:0;left:0;height:2px;width:100%;background:var(--ac);transform-origin:left;animation:load 1s ease-in-out infinite;z-index:50}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}@keyframes load{0%{transform:scaleX(0)}70%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',att:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',fee:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',ann:'<path d="M4 10v4h3l7 4V6L7 10zM18 9a4 4 0 0 1 0 6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5M16 5a3.5 3.5 0 0 1 0 7M18 14.5c2.2.6 3.5 2.3 3.5 5"/>',more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',msg:'<path d="M4 5h16v11H9l-5 4z"/>',pulse:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',build:'<path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const ic=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const av=n=>`<span class="av" style="background:hsl(${[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360} 55% 42%)">${esc(String(n)[0]||'?')}</span>`;
const need=s=>{const e=document.querySelector(s);if(!e)throw 0;return e};
const kpis=a=>`<div class="kpis">${a.map(([n,v,cap,tone])=>`<div class="kpi"><span class="kl">${n}</span><b>${v}</b><span class="kc"><i class="dot ${tone||''}"></i>${cap}</span></div>`).join('')}</div>`;
const dl=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const chart={line(v,l){const W=560,H=176,p=42,n=v.length,x=i=>p+i*(W-p-28)/Math.max(1,n-1),y=a=>H-26-(a/100)*(H-46),P=v.map((a,i)=>[x(i),y(a)]),d=P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Attendance rate">${[0,50,100].map(g=>`<line x1="${p}" x2="${W-28}" y1="${y(g)}" y2="${y(g)}" class="gl"/><text x="${p-8}" y="${y(g)+4}" class="gt" text-anchor="end">${g}%</text>`).join('')}<path d="${d} L${P[n-1][0]} ${H-26} L${P[0][0]} ${H-26}Z" class="ar"/><path d="${d}" class="ln"/>${P.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" class="dt"/>`).join('')}${l.map((t,i)=>i%Math.ceil(n/6)==0||i==n-1?`<text x="${x(i)}" y="${H-7}" class="gt" text-anchor="middle">${t}</text>`:'').join('')}</svg>`},
bar(v,l){const W=560,H=176,p=42,n=v.length,m=Math.max(1,...v),bw=(W-p-28)/n,y=a=>H-26-(a/m)*(H-46);
return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Absences per day">${[0,m].map(g=>`<line x1="${p}" x2="${W-28}" y1="${y(g)}" y2="${y(g)}" class="gl"/><text x="${p-8}" y="${y(g)+4}" class="gt" text-anchor="end">${g}</text>`).join('')}${v.map((a,i)=>`<rect class="bar" x="${(p+i*bw+bw*.2).toFixed(1)}" y="${y(a)}" width="${(bw*.6).toFixed(1)}" height="${(H-26-y(a)).toFixed(1)}" rx="3"/>`).join('')}${l.map((t,i)=>i%Math.ceil(n/6)==0||i==n-1?`<text x="${(p+i*bw+bw/2).toFixed(1)}" y="${H-7}" class="gt" text-anchor="middle">${t}</text>`:'').join('')}</svg>`}};
const td=()=>new Date().toLocaleDateString('en-CA'),when=t=>t?new Date(t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'Never';
let T=sessionStorage.t||'',S={me:null,insts:[],inst:null,mode:null,tab:'dash',secs:[],sec:null,day:td(),month:td().slice(0,7),L:['Class','Classes']};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
let nb=0;const busy_=d=>{nb+=d;document.body.classList.toggle('busy',nb>0)};
async function api(p,m='GET',b){busy_(1);const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),25000);let r;
try{r=await fetch('/api/'+p,{method:m,signal:ac.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined})}catch{throw Error('Network problem. Please try again.')}finally{clearTimeout(tm);busy_(-1)}
let j={};try{j=await r.json()}catch{}
if(r.status==401&&p!='login'&&p!='admin/login'){out('Your session ended. Please sign in again.');throw 0}if(!r.ok)throw Error(j.error||'Something went wrong');return j}
function ask(html,get){return new Promise(res=>{const v=document.createElement('div');v.className='veil';v.innerHTML=`<div class="card">${html}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="no">Cancel</button><button class="btn ${/Delete|Remove|Suspend/i.test(html)?'dr':'p'}" id="yes">Confirm</button></div></div>`;document.body.append(v);
$('#no').onclick=()=>{v.remove();res(false)};$('#yes').onclick=()=>{let r=true;try{if(get)r=get()}catch(e){toast(e.message);return}v.remove();res(r)}})}
const run=async f=>{try{await f()}catch(e){if(e)toast(e.message)}};
const out=msg=>{sessionStorage.t=T='';S.me=null;S.inst=null;S.mode=null;S.tab='dash';S.sec=null;S.note=typeof msg=='string'?msg:'';login()};
const isAdm=()=>S.me.role!='staff',cur=()=>S.insts.find(i=>i.id==S.inst);
const roleName=(r,t)=>r=='super'?'Administrator':r=='head'?(t=='schl'?'Principal':'Director'):(t=='schl'?'Class teacher':'Batch teacher');
const ADMPAGE=location.pathname.replace(/\/+$/,'')=='/admin';
const pwf=(id,label,secret)=>`<label>${label}</label><div class="pw"><input id="${id}" type="${secret?'password':'text'}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">${secret?`<button type="button" class="ib" data-eye="${id}" aria-label="Show or hide">${ic('eye',18)}</button>`:''}<button type="button" class="ib" data-clr="${id}" aria-label="Clear">${ic('x',18)}</button></div>`;
const bindPw=()=>{document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.eye);i.type=i.type=='password'?'text':'password';i.focus()});document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.clr);i.value='';i.focus()})};
function login(){const n=S.note;S.note='';document.title=ADMPAGE?'Administrator':'Institute Desk';
$('#app').innerHTML=`<div class="lg"><div class="card lgc"><div class="lgm"><i class="logo"></i></div><h1>${ADMPAGE?'Administrator sign in':'Sign in'}</h1><p class="mut">${ADMPAGE?'Authorised access only.':'Use the username and password given by your institute.'}</p>${n?`<p class="no">${esc(n)}</p>`:''}${pwf('un','Username',false)}${pwf('pw','Password',true)}<div style="margin-top:18px"><button class="btn p" id="go" style="width:100%;justify-content:center;padding:10px">Sign in</button></div></div></div>`;bindPw();
$('#go').onclick=()=>run(async()=>{T=(await api(ADMPAGE?'admin/login':'login','POST',{username:$('#un').value,password:$('#pw').value})).token;sessionStorage.t=T;S.tab='dash';await boot()});
// NOTE: this handler must not return false, otherwise the keyboard Backspace key is cancelled
$('#pw').onkeydown=e=>{if(e.key=='Enter')$('#go').click()}}

need('#main').innerHTML=`<div class="card"><h2>${sch?'Principal':'Director'}</h2><p class="mut">Full access to every ${cl}, all fees, notices and settings.</p><div class="plist">${heads.map(u=>person(u,'Full access')).join('')||'<p class="mut">No head login yet.</p>'}</div></div>
<div class="card"><div class="row"><h2 style="flex:1">${TT}s</h2><span class="tag">${secs.filter(s=>staff.some(u=>u.sec==s.id)).length} of ${secs.length} ${S.L[1].toLowerCase()} assigned</span></div><p class="mut">Each teacher opens only their own ${cl}: attendance, student details, fee approval and notices for that ${cl}.</p>
${secs.map(s=>`<div class="clsrow"><div class="clsname"><b>${esc(s.name)}</b><span class="mut">${s.n} students</span></div><div class="plist">${staff.filter(u=>u.sec==s.id).map(u=>person(u,esc(s.name))).join('')||`<div class="pcard empty"><span class="mut">No teacher assigned</span><button class="btn sm t" data-as="${s.id}">Add teacher</button></div>`}</div></div>`).join('')||`<p class="mut">Create a ${cl} first in the ${S.L[1]} tab.</p>`}
${loose.length?`<div class="clsrow"><div class="clsname"><b>Without a ${cl}</b></div><div class="plist">${loose.map(u=>person(u,'not assigned')).join('')}</div></div>`:''}</div>
<div class="card" id="addt"><h2>Add a ${TT.toLowerCase()}</h2><div class="grid"><div><label>Full name</label><input id="tn"></div><div><label>${S.L[0]}</label><select id="ts">${secs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div><label>Username</label><input id="tu" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div><div><label>Password (min 6)</label><input id="tp" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div></div><div style="margin-top:14px"><button class="btn p" id="ta">Create login</button></div></div>`;
$('#ta').onclick=()=>run(async()=>{const b={inst:S.inst,name:$('#tn').value,sec:$('#ts').value,username:$('#tu').value,password:$('#tp').value};if(await ask(`<h2>Create login?</h2><p>${esc(b.username)} will only access the selected ${cl}.</p>`)){await api('users','POST',b);toast('Login created');V.team()}});
document.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{$('#ts').value=b.dataset.as;$('#addt').scrollIntoView({behavior:'smooth'});$('#tn').focus()});
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>run(async()=>{const p=await ask('<h2>Reset password</h2><label>New password (min 6)</label><input id="np" style="width:100%" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off">',()=>{const v=$('#np').value;if(v.length<6)throw Error('At least 6 characters');return v});if(p){await api('users/'+b.dataset.r,'PUT',{password:p});toast('Password changed')}}));
document.querySelectorAll('[data-t2]').forEach(b=>b.onclick=()=>run(async()=>{if(await ask('<p>Change this account\'s access?</p>')){await api('users/'+b.dataset.t2,'PUT',{active:!!+b.dataset.v});V.team()}}));
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>run(async()=>{if(await ask('<h2>Delete this login?</h2>')){await api('users/'+b.dataset.d,'DELETE');V.team()}}))},
async actv(){const list=await api('activity?limit=200&inst='+S.inst);need('#main').innerHTML=actHtml(list,false)},
async log(){const r=await api('log?inst='+S.inst);need('#main').innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Message log</h2><button class="btn sm" id="e1">Export students CSV</button><button class="btn sm" id="e2">Export attendance CSV</button></div><p class="mut">"dry-run" means no WhatsApp token is set yet, so the message was only recorded.</p><table><tr><th>Time</th><th>To</th><th>Type</th><th>Status</th></tr>${r.map(x=>`<tr><td>${when(x.ts)}</td><td>${esc(x.phone)}</td><td>${esc(x.kind)}</td><td class="${x.status=='failed'?'no':x.status=='sent'?'ok':'mut'}">${esc(x.status)} ${esc(x.info)}</td></tr>`).join('')}</table></div>`;
for(const [id,k] of [['e1','students'],['e2','attendance']])$('#'+id).onclick=()=>run(async()=>{const c=(await api(`export?inst=${S.inst}&kind=${k}`)).csv;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c]));a.download=k+'.csv';a.click()})},
async set(){const i=cur(),c=i.cfg,su=S.me.role=='super';need('#main').innerHTML=`<div class="card"><h2>Settings</h2><div class="grid"><div><label>Institute name</label><input id="nm" value="${esc(i.name)}" ${su?'':'disabled'}></div><div><label>Type</label><select id="ty" ${su?'':'disabled'}><option value="cc" ${i.type=='cc'?'selected':''}>Coaching centre</option><option value="schl" ${i.type=='schl'?'selected':''}>School / college</option></select></div><div><label>Theme colour</label><input type="color" id="co" value="${c.color}"></div><div><label>Fee reminders start after this day of the month</label><input type="number" id="fd" min="1" max="28" value="${c.feeDay}"></div></div>
<h2 style="margin-top:20px">WhatsApp (this institute's own number)</h2><div class="grid"><div><label>Phone Number ID</label><input id="wi" value="${esc(i.wa_id)}"></div><div><label>Access token ${i.has_token?'(saved, leave blank to keep)':''}</label><input id="wt" type="password" autocomplete="off"></div><div><label>Template language</label><input id="lg" value="${esc(c.lang)}"></div></div>
<h2 style="margin-top:20px">Approved template names</h2><div class="grid">${Object.entries(c.tpl).map(([k,v])=>`<div><label>${k}</label><input data-tp="${k}" value="${esc(v)}"></div>`).join('')}</div><div style="margin-top:18px"><button class="btn p" id="sv">Save settings</button></div></div>`;
$('#sv').onclick=()=>run(async()=>{if(await ask('<p>Save these settings?</p>')){const tpl={};document.querySelectorAll('[data-tp]').forEach(e=>tpl[e.dataset.tp]=e.value.trim());await api('inst/'+i.id,'PUT',{name:$('#nm').value,type:$('#ty').value,wa_id:$('#wi').value.trim(),wa_token:$('#wt').value.trim(),cfg:{color:$('#co').value,feeDay:+$('#fd').value,lang:$('#lg').value.trim(),tpl}});toast('Saved');boot()}})},
async acct(){const m=S.me,i=cur();need('#main').innerHTML=`<div class="card"><div class="row">${av(m.name)}<div style="flex:1"><h2>${esc(m.name)}</h2><span class="mut">${roleName(m.role,i?.type)} · ${esc(m.username)}${i?' · '+esc(i.name):''}</span></div></div></div>
<div class="card"><p class="mut">${m.role=='super'?'Manage your administrator username and password in the My login tab.':'Passwords are managed by your administrator. Contact them if you need a change.'}</p></div>
<div class="card"><button class="btn d" id="so">Sign out</button></div>`;
$('#so').onclick=()=>run(async()=>{if(await ask('<p>Sign out now?</p>')){try{await api('logout','POST')}catch{}out()}})}};

function sheet(rows){const sn=S.secs.find(s=>s.id==S.sec)?.name||'';
const C=[{k:'name',l:'Name'},{k:'phone',l:'Parent number'},{k:'roll',l:'Roll no.'},...S.cols.map(c=>({k:'x'+c.id,l:c.name,t:c.type,o:c.opts}))];
const val=(r,c)=>c.k[0]=='x'?((r.extra||{})[c.k.slice(1)]??''):(r[c.k]??'');
const cell=(c,v)=>{const a=`data-c="${c.k}"`;if(c.t=='dropdown')return `<select ${a}><option value=""></option>${c.o.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;return `<input ${a} type="${c.t=='date'?'date':'text'}" ${c.t=='number'?'inputmode="decimal"':c.k=='phone'?'inputmode="tel"':''} value="${esc(v)}">`};
const tr=(r,d)=>`<tr data-row="${r.id}" class="${d?'dirty':''}">${C.map(c=>`<td>${cell(c,val(r,c))}</td>`).join('')}<td><button class="btn sm d" data-del>Delete</button></td></tr>`;
need('#box').innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">${esc(sn)} · ${rows.length} students</h2><button class="btn sm" id="cl">Columns</button><button class="btn sm" id="ar">Add row</button><button class="btn p" id="sv" disabled>Save changes</button></div><p class="mut">Tap any cell to edit. Changed rows turn yellow. Press Save changes when you are done.</p>
<div class="sheet"><table style="min-width:${C.length*160+90}px"><tr>${C.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th></th></tr><tbody id="tb">${rows.map(r=>tr(r)).join('')}</tbody></table></div></div>
<div class="card"><h2>Paste from Excel or Google Sheets</h2><p class="mut">Copy the rows (without a heading row) and paste them here. Column order: ${C.map(c=>esc(c.l)).join(' | ')}</p><textarea id="bk" placeholder="Rahul Sharma&#9;9876543210&#9;1"></textarea><div style="margin-top:10px"><button class="btn p" id="ba">Import students</button></div></div>`;
const dirty=new Set(),tb=$('#tb');let dn=0;const upd=()=>{$('#sv').disabled=!dirty.size;$('#sv').textContent=dirty.size?`Save changes (${dirty.size})`:'Save changes'};
const mk=e=>{const r=e.target.closest('tr[data-row]');if(r){dirty.add(r);r.classList.add('dirty');upd()}};tb.addEventListener('input',mk);tb.addEventListener('change',mk);
tb.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;const r=b.closest('tr');run(async()=>{const id=r.dataset.row;if(await ask('<h2>Delete this student?</h2><p>Their details and attendance are removed.</p>')){if(id[0]!='n')await api('stu/'+id,'DELETE');dirty.delete(r);r.remove();upd();toast('Deleted')}})});
$('#ar').onclick=()=>{tb.insertAdjacentHTML('afterbegin',tr({id:'n'+(++dn)},true));const r=tb.firstElementChild;dirty.add(r);upd();r.querySelector('input').focus()};
$('#cl').onclick=()=>{if(dirty.size){toast('Save your changes first');return}colsModal()};
$('#sv').onclick=()=>run(async()=>{if(!await ask(`<h2>Save ${dirty.size} change(s)?</h2><p>The student details will be updated.</p>`))return;
for(const r of [...dirty]){const o={extra:{}};r.querySelectorAll('[data-c]').forEach(e=>{const k=e.dataset.c;if(k[0]=='x')o.extra[k.slice(1)]=e.value;else o[k]=e.value});const id=r.dataset.row;
try{if(id[0]=='n')r.dataset.row=(await api('stu','POST',{...o,sec:S.sec})).id;else await api('stu/'+id,'PUT',o)}catch(e){toast((o.name||'Row')+': '+(e&&e.message));upd();return}
dirty.delete(r);r.classList.remove('dirty');upd()}toast('Saved');V.stu()});
$('#ba').onclick=()=>run(async()=>{if(!$('#bk').value.trim())throw Error('Paste some rows first');if(await ask('<p>Import these students?</p>')){const r=await api('stu/bulk','POST',{sec:S.sec,text:$('#bk').value});toast(r.added+' added'+(r.skipped?`, ${r.skipped} skipped (check the number or a required field)`:''));V.stu()}})}
function colsModal(){const v=document.createElement('div');v.className='veil';document.body.append(v);
const draw=()=>{v.innerHTML=`<div class="card" style="max-height:90vh;overflow:auto"><h2>Columns</h2><p class="mut">Name, Parent number and Roll no. are always there. Add your own, like address or date of birth.</p>${S.cols.map(c=>`<div class="row" style="margin:8px 0"><b style="flex:1">${esc(c.name)} <span class="tag">${c.type}</span></b><button class="btn sm" data-rn="${c.id}">Edit</button>${isAdm()?`<button class="btn sm d" data-rm="${c.id}">Delete</button>`:''}</div>`).join('')||'<p class="mut">No extra columns yet.</p>'}
<h2 style="margin-top:14px;font-size:17px">Add a column</h2><label>Column name</label><input id="cn" style="width:100%"><label>Type</label><select id="ct"><option value="text">Text</option><option value="date">Date</option><option value="number">Number</option><option value="dropdown">Dropdown</option></select><div id="co2" style="display:none"><label>Options (one per line)</label><textarea id="cop" style="min-height:80px"></textarea></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="cc">Close</button><button class="btn p" id="ca">Add column</button></div></div>`;
$('#ct').onchange=e=>{$('#co2').style.display=e.target.value=='dropdown'?'block':'none'};$('#cc').onclick=()=>{v.remove();V.stu()};
$('#ca').onclick=()=>run(async()=>{const b={inst:S.inst,name:$('#cn').value,type:$('#ct').value,opts:$('#cop').value};if(await ask(`<p>Add column "${esc(b.name)}"?</p>`)){await api('cols','POST',b);S.cols=await api('cols?inst='+S.inst);draw();toast('Column added')}});
v.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>run(async()=>{const c=S.cols.find(x=>x.id==b.dataset.rn);const r=await ask(`<h2>Edit column</h2><label>Name</label><input id="rn" style="width:100%" value="${esc(c.name)}">${c.type=='dropdown'?`<label>Options (one per line)</label><textarea id="ro" style="min-height:80px">${esc(c.opts.join('\n'))}</textarea>`:''}`,()=>({name:$('#rn').value,opts:c.type=='dropdown'?$('#ro').value:''}));if(r){await api('cols/'+c.id,'PUT',r);S.cols=await api('cols?inst='+S.inst);draw()}}));
v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>run(async()=>{if(await ask('<h2>Delete this column?</h2><p>The values typed in it will no longer be shown.</p>')){await api('cols/'+b.dataset.rm,'DELETE');S.cols=await api('cols?inst='+S.inst);draw()}}))};draw()}
function actHtml(list,showInst){return `<div class="card"><h2>Activity</h2><p class="mut">Latest 200 actions.</p><table><tr><th>Time</th><th>User</th>${showInst?'<th>Institute</th>':''}<th>Action</th><th>Details</th></tr>${list.map(a=>`<tr><td class="mut">${when(a.ts)}</td><td>${esc(a.uname)}<br><span class="mut">${esc(a.role)}</span></td>${showInst?`<td>${esc(a.inst_name||'-')}</td>`:''}<td>${esc(a.action)}</td><td class="mut">${esc(a.detail)}</td></tr>`).join('')}</table></div>`}
let last=Date.now();['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{last=Date.now()},{passive:true}));
setInterval(()=>{if(T&&Date.now()-last>30*60e3)out('You were signed out after 30 minutes of inactivity.')},30000);
T?boot().catch(()=>login()):login();
</script></body></html>
