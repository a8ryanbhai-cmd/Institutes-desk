<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Institute Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#0f8b8d;--ink:#0f1c2e;--bg:#f6f3ec;--card:#fff;--ok:#1f9d6b;--no:#d6455d;--gold:#c9a45c;--gold2:#e6cf9b;--line:#e8e2d4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:98px;background:radial-gradient(1000px 420px at 88% -8%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),radial-gradient(700px 380px at -8% 32%,#c9a45c24,transparent),var(--bg);background-attachment:fixed}
h1,h2,.brand{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}h2{font-size:20px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 16px;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0f1c2e,#13263d);color:#fff;border-bottom:1px solid #c9a45c66}
.brand{flex:1;font-size:19px;white-space:nowrap;display:flex;align-items:center;gap:10px;overflow:hidden;text-overflow:ellipsis}.logo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:inline-block;box-shadow:0 0 12px #c9a45c88;flex:none}
.wrap{max-width:1040px;margin:auto;padding:14px}
.hero{border-radius:26px;padding:24px 22px;color:#fff;position:relative;overflow:hidden;animation:up .5s both;background:linear-gradient(120deg,#0b1a2e 0%,color-mix(in srgb,var(--ac) 50%,#0b1a2e) 100%);box-shadow:0 18px 40px -22px #0b1a2e;border:1px solid #c9a45c55}
.hero:before{content:'';position:absolute;inset:0;background:radial-gradient(260px 170px at 95% 0,#c9a45c55,transparent 70%),repeating-radial-gradient(circle at 100% 0,#ffffff12 0 1px,transparent 1px 24px)}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 36%,#ffffff2e 48%,transparent 60%);transform:translateX(-130%);animation:sheen 7s ease-in-out infinite}
.hero>*{position:relative;z-index:1}.hero h1{font-size:30px;line-height:1.15;margin:6px 0 4px}.hero p{margin:0;opacity:.85}
.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-weight:700;color:var(--gold2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chips span{border:1px solid #e6cf9b80;color:#f4e8c8;border-radius:999px;padding:3px 13px;font-size:12px;font-weight:600;background:#ffffff10}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;position:relative;overflow:hidden;animation:up .5s both;box-shadow:0 10px 26px -18px #0f1c2e66}
.stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.si{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);margin-bottom:8px}
.stat b{display:block;font:700 30px/1.1 Fraunces,Georgia,serif}.stat span{font-size:13px;opacity:.7}
.cols2{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:780px){.cols2{grid-template-columns:1.6fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 12px 30px -20px #0f1c2e77;animation:up .4s both;overflow-x:auto}.cols2 .card{margin:0}
.btn{border:0;background:#efebe0;color:var(--ink);border-radius:999px;padding:10px 22px;font:inherit;font-weight:700;cursor:pointer;transition:.15s;box-shadow:inset 0 0 0 1.5px #0f1c2e1f;display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 65%,#0f1c2e));color:#fff;box-shadow:0 10px 20px -10px var(--ac),inset 0 0 0 1px #ffffff30}
.btn.p:before{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff55 50%,transparent 60%);transform:translateX(-130%);transition:transform .7s}.btn.p:hover:before{transform:translateX(130%)}
.btn.sm{padding:5px 14px;font-size:13px}.btn.d{background:#fde7eb;color:var(--no);box-shadow:none}
.tg{border:0;border-radius:999px;padding:6px 16px;font:700 13px 'Plus Jakarta Sans';cursor:pointer;min-width:92px;color:#fff}.tg.p{background:var(--ok)}.tg.a{background:var(--no)}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:7px 16px;margin:3px;cursor:pointer;font-weight:600;background:#efebe0;transition:.15s}.pill.on{background:var(--ink);color:#fff}.pill.lock{opacity:.5;cursor:not-allowed}
.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(580px,94vw);display:flex;background:linear-gradient(180deg,#13263d,#0f1c2e);border-radius:999px;padding:6px;z-index:6;box-shadow:0 16px 34px -10px #000b;border:1px solid #c9a45c66}
.nav span{flex:1;text-align:center;color:#ffffffa6;padding:6px 0;border-radius:999px;cursor:pointer;font-size:10.5px;font-weight:700;line-height:1.2}.nav svg{display:block;margin:0 auto 1px}.nav span.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0f1c2e}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;margin-right:10px;vertical-align:middle;flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;background:#ffffff1a;border-radius:999px;padding:3px 14px 3px 4px;font:700 13px 'Plus Jakarta Sans';cursor:pointer;color:#fff}.chip .av{margin:0;width:28px;height:28px}
input,select,textarea{font:inherit;border:1.5px solid #0f1c2e22;border-radius:14px;padding:9px 13px;background:#fff;color:var(--ink);max-width:100%}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}input:disabled{opacity:.6}
textarea{width:100%;min-height:120px}label{display:block;font-weight:700;margin:10px 0 3px;font-size:13px}
table{width:100%;border-collapse:collapse;min-width:420px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:11px;letter-spacing:.06em;opacity:.6;text-transform:uppercase}
tr.abs td{background:#fde7eb88}.tag{border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;background:#efebe0;white-space:nowrap}.tag.ok{background:#dcf5e9;color:#16794f}.tag.no{background:#fde7eb;color:var(--no)}
.ok{color:var(--ok)}.no{color:var(--no)}.mut{opacity:.68}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center;position:relative;background:conic-gradient(var(--ac) calc(var(--p)*1%),#ece7da 0)}.ring:before{content:'';position:absolute;inset:14px;border-radius:50%;background:#fff}.ring b{position:relative;font:700 30px Fraunces,Georgia,serif}
.pcard{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:10px}.pcard.empty{flex-direction:row;align-items:center;justify-content:space-between;background:#faf8f2;border-style:dashed}
.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.clsrow{padding:12px 0;border-top:1px solid var(--line)}.clsname{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.bar2{height:12px;border-radius:99px;background:#ece7da;margin-top:8px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--gold));border-radius:99px}
.veil{position:fixed;inset:0;background:#0f1c2ea6;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:9}.veil .card{max-width:420px;width:92%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{border-radius:20px;padding:14px;background:#faf8f2;border:1.5px solid var(--line);cursor:pointer;transition:.15s}.tile b{display:block;font-size:16px}.tile.me{border-color:var(--ac);background:#fff;box-shadow:0 8px 20px -12px var(--ac)}.tile.lock{opacity:.55;cursor:not-allowed}
.mc{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;background:#faf8f2;border:1px solid var(--line);cursor:pointer;font-weight:700}.mc svg{color:var(--ac)}
tr.dirty td{background:#fff3c4}.sheet{overflow-x:auto}.sheet input,.sheet select{width:100%;min-width:130px;padding:6px 9px;border-radius:10px}
.pw{display:flex;align-items:center;gap:2px;border:1.5px solid #0f1c2e22;border-radius:14px;background:#fff;padding-right:4px}.pw:focus-within{border-color:var(--ac)}.pw input{border:0;flex:1;min-width:0;background:transparent}.pw input:focus{outline:0}
.ib{border:0;background:none;color:var(--ink);opacity:.6;padding:6px;cursor:pointer;display:grid;place-items:center}.ib:hover{opacity:1}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 24px;z-index:10;display:none;max-width:92vw;text-align:center;border:1px solid #c9a45c88}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheen{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@media (prefers-reduced-motion:reduce){.hero:after{animation:none}.card,.stat,.hero{animation:none}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',att:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',fee:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',ann:'<path d="M4 10v4h3l7 4V6L7 10zM18 9a4 4 0 0 1 0 6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5M16 5a3.5 3.5 0 0 1 0 7M18 14.5c2.2.6 3.5 2.3 3.5 5"/>',more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',msg:'<path d="M4 5h16v11H9l-5 4z"/>',pulse:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',build:'<path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const ic=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const av=n=>`<span class="av" style="background:hsl(${[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360} 55% 42%)">${esc(String(n)[0]||'?')}</span>`;
const need=s=>{const e=document.querySelector(s);if(!e)throw 0;return e};
const stats=a=>`<div class="stats">${a.map(([n,v,c,i],k)=>`<div class="stat" style="--c:${c};animation-delay:${k*.07}s"><i class="si">${ic(i,20)}</i><b>${v}</b><span>${n}</span></div>`).join('')}</div>`;
const td=()=>new Date().toLocaleDateString('en-CA'),when=t=>t?new Date(t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'Never';
let T=sessionStorage.t||'',S={me:null,insts:[],inst:null,mode:null,tab:'dash',secs:[],sec:null,day:td(),month:td().slice(0,7),L:['Class','Classes']};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
async function api(p,m='GET',b){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),25000);let r;
try{r=await fetch('/api/'+p,{method:m,signal:ac.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined})}catch{throw Error('Network problem. Please try again.')}finally{clearTimeout(tm)}
let j={};try{j=await r.json()}catch{}
if(r.status==401&&p!='login'&&p!='admin/login'){out('Your session ended. Please sign in again.');throw 0}if(!r.ok)throw Error(j.error||'Something went wrong');return j}
function ask(html,get){return new Promise(res=>{const v=document.createElement('div');v.className='veil';v.innerHTML=`<div class="card">${html}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="no">Cancel</button><button class="btn p" id="yes">Confirm</button></div></div>`;document.body.append(v);
$('#no').onclick=()=>{v.remove();res(false)};$('#yes').onclick=()=>{let r=true;try{if(get)r=get()}catch(e){toast(e.message);return}v.remove();res(r)}})}
const run=async f=>{try{await f()}catch(e){if(e)toast(e.message)}};
const out=msg=>{sessionStorage.t=T='';S.me=null;S.inst=null;S.mode=null;S.tab='dash';S.sec=null;S.note=typeof msg=='string'?msg:'';login()};
const isAdm=()=>S.me.role!='staff',cur=()=>S.insts.find(i=>i.id==S.inst);
const roleName=(r,t)=>r=='super'?'Administrator':r=='head'?(t=='schl'?'Principal':'Director'):(t=='schl'?'Class teacher':'Batch teacher');
const ADMPAGE=location.pathname.replace(/\/+$/,'')=='/admin';
const pwf=(id,label,secret)=>`<label>${label}</label><div class="pw"><input id="${id}" type="${secret?'password':'text'}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">${secret?`<button type="button" class="ib" data-eye="${id}" aria-label="Show or hide">${ic('eye',18)}</button>`:''}<button type="button" class="ib" data-clr="${id}" aria-label="Clear">${ic('x',18)}</button></div>`;
const bindPw=()=>{document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.eye);i.type=i.type=='password'?'text':'password';i.focus()});document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.clr);i.value='';i.focus()})};
function login(){const n=S.note;S.note='';document.title=ADMPAGE?'Administrator':'Institute Desk';
$('#app').innerHTML=`<div class="wrap" style="max-width:420px;margin-top:8vh"><div class="hero" style="padding-bottom:56px"><h1>${ADMPAGE?'Administrator':'Institute Desk'}</h1><p>${ADMPAGE?'Restricted area. Authorised access only.':'Attendance, fees and notices in one place.'}</p></div><div class="card" style="position:relative;z-index:2;margin-top:-30px"><h2>Sign in</h2>${n?`<p class="no">${esc(n)}</p>`:''}${pwf('un','Username',false)}${pwf('pw','Password',true)}<div style="margin-top:16px"><button class="btn p" id="go">Sign in</button></div></div></div>`;bindPw();
$('#go').onclick=()=>run(async()=>{T=(await api(ADMPAGE?'admin/login':'login','POST',{username:$('#un').value,password:$('#pw').value})).token;sessionStorage.t=T;S.tab='dash';await boot()});
// NOTE: this handler must not return false, otherwise the keyboard Backspace key is cancelled
$('#pw').onkeydown=e=>{if(e.key=='Enter')$('#go').click()}}
async function boot(){S.me=await api('me');if(ADMPAGE&&S.me.role!='super'){out('This page is for the administrator only.');return}S.insts=await api('inst');
if(S.me.role=='super'){if(!S.mode){S.mode='admin';S.tab='adm'}if(S.inst&&!cur()){S.inst=null;S.mode='admin';S.tab='adm'}}
else{S.inst=S.me.inst;S.mode='inst';if(['adm','admact'].includes(S.tab))S.tab='dash';if(S.me.role=='staff'){S.sec=S.me.sec;if(['team','log','actv','set','more'].includes(S.tab))S.tab='dash'}}
await frame()}
async function render(){if(S.inst&&!cur())S.insts=await api('inst');if(S.me.role=='super'&&S.mode=='inst'&&!cur()){S.mode='admin';S.inst=null;S.tab='adm'}
const admin=S.me.role=='super'&&S.mode=='admin',i=cur();if(i)document.documentElement.style.setProperty('--ac',i.cfg.color);else document.documentElement.style.setProperty('--ac','#0f8b8d');
S.L=i?.type=='schl'?['Class','Classes']:['Batch','Batches'];const m=S.me,staff=m.role=='staff';
const nav=[['dash','home','Home'],['att','att','Attendance'],['fee','fee','Fees'],['ann','ann','Notices'],['stu','users',S.L[1]]];if(!staff)nav.push(['more','more','More']);
$('#app').innerHTML=`<div class="top"><div class="brand"><i class="logo"></i>${esc(i?i.name:'Institute Desk')}</div>${m.role=='super'&&!admin?'<button class="btn sm" id="bkadm">Back to admin</button>':''}<button class="chip" data-t="acct">${av(m.name)}${esc(m.name.split(' ')[0])}</button></div><div class="wrap">${admin?`<div><span class="pill ${S.tab=='adm'?'on':''}" data-t="adm">Institutes</span><span class="pill ${S.tab=='admact'?'on':''}" data-t="admact">All activity</span><span class="pill ${S.tab=='admacct'?'on':''}" data-t="admacct">My login</span></div>`:''}<div id="main"></div></div>${admin?'':`<div class="nav">${nav.map(([k,e,n])=>`<span class="${S.tab==k?'on':''}" data-t="${k}">${ic(e,20)}${n}</span>`).join('')}</div>`}`;
if($('#bkadm'))$('#bkadm').onclick=()=>{S.mode='admin';S.inst=null;S.tab='adm';frame()};
document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{S.tab=e.dataset.t;frame()});await run(()=>V[S.tab]())}
let busy=false,again=false;
async function frame(){if(busy){again=true;return}busy=true;try{do{again=false;await render()}while(again)}catch(e){if(e)toast(e.message)}finally{busy=false}}
async function secBar(){S.secs=await api('sec?inst='+S.inst);const mine=S.secs.find(s=>!s.locked);if(S.me.role=='staff')S.sec=S.me.sec;else if(!S.secs.find(s=>s.id==S.sec))S.sec=S.secs[0]?.id||null;
return `<div class="card">${S.secs.map(s=>s.locked?`<span class="pill lock" title="Assigned to ${esc(s.teacher||'another teacher')}">${ic('lock',14)}${esc(s.name)}</span>`:`<span class="pill ${s.id==S.sec?'on':''}" data-s="${s.id}">${esc(s.name)} · ${s.n}</span>`).join('')||`<span class="mut">No ${S.L[1].toLowerCase()} yet.${isAdm()?' Create one in the '+S.L[1]+' tab.':''}</span>`}</div>`}
const bindSec=f=>document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{S.sec=+e.dataset.s;run(f)});
const V={
async adm(){const o=await api('overview'),t=o.totals,ac=await api('admin/account');S.insts=o.list;need('#main').innerHTML=`<div class="hero"><p>Administrator console</p><h1>All institutes</h1></div>${ac.custom?'':'<div class="card"><b>Set your own admin login.</b> <span class="mut">You are still using the server password.</span> <button class="btn sm p" data-t="admacct">Open My login</button></div>'}
${stats([['Institutes',t.institutes,'#0f8b8d','build'],['Accounts',t.accounts,'#4f5bd5','users'],['Students',t.students,'#1f9d6b','users'],['Actions today',t.activityToday,'#c9a45c','pulse']])}
<div class="card"><h2>Add a new institute</h2><p class="mut">This creates the institute and its head login (principal or director).</p><div class="grid"><div><label>Institute name</label><input id="an"></div><div><label>Type</label><select id="at"><option value="cc">Coaching centre (batches)</option><option value="schl">School / college (classes)</option></select></div><div><label>Head username</label><input id="au" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div><div><label>Head password (min 6)</label><input id="ap" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div></div><div style="margin-top:14px"><button class="btn p" id="ad">Create institute</button></div></div>

const C=[{k:'name',l:'Name'},{k:'phone',l:'Parent number'},{k:'roll',l:'Roll no.'},...S.cols.map(c=>({k:'x'+c.id,l:c.name,t:c.type,o:c.opts}))];
const val=(r,c)=>c.k[0]=='x'?((r.extra||{})[c.k.slice(1)]??''):(r[c.k]??'');
const cell=(c,v)=>{const a=`data-c="${c.k}"`;if(c.t=='dropdown')return `<select ${a}><option value=""></option>${c.o.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;return `<input ${a} type="${c.t=='date'?'date':'text'}" ${c.t=='number'?'inputmode="decimal"':c.k=='phone'?'inputmode="tel"':''} value="${esc(v)}">`};
const tr=(r,d)=>`<tr data-row="${r.id}" class="${d?'dirty':''}">${C.map(c=>`<td>${cell(c,val(r,c))}</td>`).join('')}<td><button class="btn sm d" data-del>Delete</button></td></tr>`;
need('#box').innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">${esc(sn)} · ${rows.length} students</h2><button class="btn sm" id="cl">Columns</button><button class="btn sm" id="ar">Add row</button><button class="btn p" id="sv" disabled>Save changes</button></div><p class="mut">Tap any cell to edit. Changed rows turn yellow. Press Save changes when you are done.</p>
<div class="sheet"><table style="min-width:${C.length*160+90}px"><tr>${C.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th></th></tr><tbody id="tb">${rows.map(r=>tr(r)).join('')}</tbody></table></div></div>
<div class="card"><h2>Paste from Excel or Google Sheets</h2><p class="mut">Copy the rows (without a heading row) and paste them here. Column order: ${C.map(c=>esc(c.l)).join(' | ')}</p><textarea id="bk" placeholder="Rahul Sharma&#9;9876543210&#9;1"></textarea><div style="margin-top:10px"><button class="btn p" id="ba">Import students</button></div></div>`;
const dirty=new Set(),tb=$('#tb');let dn=0;const upd=()=>{$('#sv').disabled=!dirty.size;$('#sv').textContent=dirty.size?`Save changes (${dirty.size})`:'Save changes'};
const mk=e=>{const r=e.target.closest('tr[data-row]');if(r){dirty.add(r);r.classList.add('dirty');upd()}};tb.addEventListener('input',mk);tb.addEventListener('change',mk);
tb.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;const r=b.closest('tr');run(async()=>{const id=r.dataset.row;if(await ask('<h2>Delete this student?</h2><p>Their details and attendance are removed.</p>')){if(id[0]!='n')await api('stu/'+id,'DELETE');dirty.delete(r);r.remove();upd();toast('Deleted')}})});
$('#ar').onclick=()=>{tb.insertAdjacentHTML('afterbegin',tr({id:'n'+(++dn)},true));const r=tb.firstElementChild;dirty.add(r);upd();r.querySelector('input').focus()};
$('#cl').onclick=()=>{if(dirty.size){toast('Save your changes first');return}colsModal()};
$('#sv').onclick=()=>run(async()=>{if(!await ask(`<h2>Save ${dirty.size} change(s)?</h2><p>The student details will be updated.</p>`))return;
for(const r of [...dirty]){const o={extra:{}};r.querySelectorAll('[data-c]').forEach(e=>{const k=e.dataset.c;if(k[0]=='x')o.extra[k.slice(1)]=e.value;else o[k]=e.value});const id=r.dataset.row;
try{if(id[0]=='n')r.dataset.row=(await api('stu','POST',{...o,sec:S.sec})).id;else await api('stu/'+id,'PUT',o)}catch(e){toast((o.name||'Row')+': '+(e&&e.message));upd();return}
dirty.delete(r);r.classList.remove('dirty');upd()}toast('Saved');V.stu()});
$('#ba').onclick=()=>run(async()=>{if(!$('#bk').value.trim())throw Error('Paste some rows first');if(await ask('<p>Import these students?</p>')){const r=await api('stu/bulk','POST',{sec:S.sec,text:$('#bk').value});toast(r.added+' added'+(r.skipped?`, ${r.skipped} skipped (check the number or a required field)`:''));V.stu()}})}
function colsModal(){const v=document.createElement('div');v.className='veil';document.body.append(v);
const draw=()=>{v.innerHTML=`<div class="card" style="max-height:90vh;overflow:auto"><h2>Columns</h2><p class="mut">Name, Parent number and Roll no. are always there. Add your own, like address or date of birth.</p>${S.cols.map(c=>`<div class="row" style="margin:8px 0"><b style="flex:1">${esc(c.name)} <span class="tag">${c.type}</span></b><button class="btn sm" data-rn="${c.id}">Edit</button>${isAdm()?`<button class="btn sm d" data-rm="${c.id}">Delete</button>`:''}</div>`).join('')||'<p class="mut">No extra columns yet.</p>'}
<h2 style="margin-top:14px;font-size:17px">Add a column</h2><label>Column name</label><input id="cn" style="width:100%"><label>Type</label><select id="ct"><option value="text">Text</option><option value="date">Date</option><option value="number">Number</option><option value="dropdown">Dropdown</option></select><div id="co2" style="display:none"><label>Options (one per line)</label><textarea id="cop" style="min-height:80px"></textarea></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="cc">Close</button><button class="btn p" id="ca">Add column</button></div></div>`;
$('#ct').onchange=e=>{$('#co2').style.display=e.target.value=='dropdown'?'block':'none'};$('#cc').onclick=()=>{v.remove();V.stu()};
$('#ca').onclick=()=>run(async()=>{const b={inst:S.inst,name:$('#cn').value,type:$('#ct').value,opts:$('#cop').value};if(await ask(`<p>Add column "${esc(b.name)}"?</p>`)){await api('cols','POST',b);S.cols=await api('cols?inst='+S.inst);draw();toast('Column added')}});
v.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>run(async()=>{const c=S.cols.find(x=>x.id==b.dataset.rn);const r=await ask(`<h2>Edit column</h2><label>Name</label><input id="rn" style="width:100%" value="${esc(c.name)}">${c.type=='dropdown'?`<label>Options (one per line)</label><textarea id="ro" style="min-height:80px">${esc(c.opts.join('\n'))}</textarea>`:''}`,()=>({name:$('#rn').value,opts:c.type=='dropdown'?$('#ro').value:''}));if(r){await api('cols/'+c.id,'PUT',r);S.cols=await api('cols?inst='+S.inst);draw()}}));
v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>run(async()=>{if(await ask('<h2>Delete this column?</h2><p>The values typed in it will no longer be shown.</p>')){await api('cols/'+b.dataset.rm,'DELETE');S.cols=await api('cols?inst='+S.inst);draw()}}))};draw()}
function actHtml(list,showInst){return `<div class="card"><h2>Activity</h2><p class="mut">Latest 200 actions.</p><table><tr><th>Time</th><th>User</th>${showInst?'<th>Institute</th>':''}<th>Action</th><th>Details</th></tr>${list.map(a=>`<tr><td class="mut">${when(a.ts)}</td><td>${esc(a.uname)}<br><span class="mut">${esc(a.role)}</span></td>${showInst?`<td>${esc(a.inst_name||'-')}</td>`:''}<td>${esc(a.action)}</td><td class="mut">${esc(a.detail)}</td></tr>`).join('')}</table></div>`}
let last=Date.now();['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{last=Date.now()},{passive:true}));
setInterval(()=>{if(T&&Date.now()-last>30*60e3)out('You were signed out after 30 minutes of inactivity.')},30000);
T?boot().catch(()=>login()):login();
</script></body></html>
